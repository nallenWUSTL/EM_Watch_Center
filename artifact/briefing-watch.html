  :root[data-theme="dark"] {

    --bw-rule: rgba(243, 242, 242, 0.35); --bw-red: #ff6a51; --bw-red-ink: #ff8f7a;

  /* Daily Intelligence Briefing — component styles shared by the dashboard's
   Daily Briefing tab and the claude.ai artifact page (artifact/build.js
   inlines this file there). Every class is prefixed bw- so nothing collides
   with the dashboard shell or the Modernist components. Colors come from the
   --bw-* tokens; the artifact adds dark-theme values for them. */

:root {
  --bw-ground: #f3f2f2;
  --bw-surface: #eae9e9;
  --bw-ink: #201e1d;
  --bw-muted: #605d5d;
  --bw-hair: #d7d3d3;
  --bw-rule: rgba(32, 30, 29, 0.4);
  --bw-red: #ec3013;
  --bw-red-ink: #ae1800;
  --bw-amber: #b8860b;
  --bw-amber-wash: #f6ead0;
  --bw-green: #1f7a4d;
  --bw-green-wash: #d9eee2;
  --bw-font: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
}

.bw { font-family: var(--bw-font); font-size: 13px; line-height: 1.45; color: var(--bw-ink); }
.bw p { margin: 0; }
.bw a { color: var(--bw-red-ink); text-decoration: none; }
.bw a:hover { text-decoration: underline; }
.bw button { font: inherit; color: inherit; }
.bw :focus-visible { outline: 2px solid var(--bw-red); outline-offset: 2px; }

.bw-band { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
@media (min-width: 720px) { .bw-band { padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); } }

.bw-eyebrow { font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--bw-muted); }
.bw-caps { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--bw-muted); }
.bw-caps--ink { color: var(--bw-ink); }
.bw-sub { font-size: 11px; color: var(--bw-muted); }
.bw-tnum { font-variant-numeric: tabular-nums; }

/* — chips — */
.bw-chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px; font-size: 10px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; white-space: nowrap; border: 2px solid transparent; }
.bw-chip-dot { width: 7px; height: 7px; background: currentColor; }
.bw-chip--normal { background: var(--bw-green-wash); color: var(--bw-green); }
.bw-chip--elevated { background: var(--bw-amber-wash); color: var(--bw-amber); }
.bw-chip--high { background: var(--bw-red); color: var(--bw-ground); }
.bw-chip--quiet { border-color: var(--bw-hair); color: var(--bw-muted); }
.bw-chip--watch { background: var(--bw-amber-wash); color: var(--bw-amber); }
.bw-chip--active { background: var(--bw-red); color: var(--bw-ground); }
.bw-chip--sev { min-width: 44px; justify-content: center; }
.bw-chip--sev1, .bw-chip--sev2 { border-color: var(--bw-hair); color: var(--bw-muted); }
.bw-chip--sev3 { background: var(--bw-amber-wash); color: var(--bw-amber); }
.bw-chip--sev4, .bw-chip--sev5 { background: var(--bw-red); color: var(--bw-ground); }
.bw-chip--now { background: var(--bw-red); color: var(--bw-ground); }
.bw-chip--today { border-color: var(--bw-rule); color: var(--bw-ink); }

/* — latest strip — */
.bw-latest { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px 28px; align-items: center; padding-block: 16px; border-bottom: 2px solid var(--bw-rule); background: var(--bw-surface); }
.bw-latest-posture { display: flex; flex-direction: column; gap: 6px; }
.bw-latest-posture .bw-chip { font-size: 12px; padding: 7px 12px; }
.bw-latest-top { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.bw-latest-top-text { font-size: 16px; font-weight: 700; line-height: 1.3; text-wrap: pretty; }
.bw-btn { display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; border: 2px solid var(--bw-ink); background: transparent; color: var(--bw-ink); font-size: 11px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; white-space: nowrap; text-decoration: none; }
.bw-btn:hover { background: var(--bw-ink); color: var(--bw-ground); text-decoration: none; }
.bw-btn--link { border-color: var(--bw-red); color: var(--bw-red-ink); }
.bw-btn--link:hover { background: var(--bw-red); color: var(--bw-ground); }
@media (max-width: 719px) { .bw-latest { grid-template-columns: 1fr; } }

/* — empty state — */
.bw-empty { padding-block: 48px 56px; border-bottom: 2px solid var(--bw-rule); display: grid; gap: 10px; }
.bw-empty > * { max-width: 60ch; }
.bw-empty-title { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
.bw-empty-body { font-size: 13px; color: var(--bw-muted); line-height: 1.5; }

/* — sections — */
.bw-sec { padding-block: 20px 26px; border-bottom: 2px solid var(--bw-rule); }
.bw-sec-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 20px; margin-bottom: 14px; }
.bw-lede { font-size: clamp(16px, 2.4vw, 19px); font-weight: 700; line-height: 1.38; letter-spacing: -0.01em; max-width: 72ch; text-wrap: pretty; }
.bw-viewing { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding-block: 10px; border-bottom: 2px solid var(--bw-rule); background: var(--bw-surface); }
.bw-viewing-text { font-size: 12px; font-weight: 700; }
.bw-linkbtn { background: none; border: none; padding: 0; color: var(--bw-red-ink); font-size: 11px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; }
.bw-linkbtn:hover { text-decoration: underline; }

/* — decisions table (a grid, so it stacks at phone width) — */
.bw-dec { display: grid; grid-template-columns: 34px minmax(0, 2.2fr) 56px 90px 90px minmax(0, 2.6fr) minmax(0, 1.4fr); border-top: 2px solid var(--bw-rule); }
.bw-dec-h { display: contents; }
.bw-dec-h > span { padding: 8px 10px 8px 0; font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--bw-muted); border-bottom: 2px solid var(--bw-rule); }
.bw-dec-r { display: contents; }
.bw-dec-r > div { padding: 12px 10px 12px 0; border-bottom: 1px solid var(--bw-hair); min-width: 0; }
.bw-dec-rank { font-size: 20px; font-weight: 800; line-height: 1; letter-spacing: -0.02em; }
.bw-dec-title { font-size: 13px; font-weight: 700; line-height: 1.35; text-wrap: pretty; }
.bw-dec-meta { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 5px; align-items: center; }
.bw-dec-action { font-size: 12px; line-height: 1.45; }
.bw-dec-owner { font-size: 11px; color: var(--bw-muted); line-height: 1.4; }
.bw-dec-label { display: none; }
@media (max-width: 899px) {
  .bw-dec { display: block; }
  .bw-dec-h { display: none; }
  .bw-dec-r { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 0 10px; padding: 12px 0; border-bottom: 1px solid var(--bw-hair); }
  .bw-dec-r > div { padding: 0; border: none; }
  .bw-dec-r > .bw-dec-c-rank { grid-row: 1 / span 5; }
  .bw-dec-r > div + div + div { margin-top: 8px; }
  .bw-dec-label { display: block; font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--bw-muted); margin-bottom: 2px; }
  .bw-dec-c-sev { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
}

/* — PIR rows — */
.bw-pirs { border-top: 2px solid var(--bw-rule); }
.bw-pir { display: grid; grid-template-columns: 52px minmax(0, 220px) 84px minmax(0, 1fr); gap: 0 14px; align-items: start; padding: 11px 0; border-bottom: 1px solid var(--bw-hair); }
.bw-pir-n { font-size: 10px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--bw-muted); padding-top: 3px; }
.bw-pir-name { font-size: 13px; font-weight: 700; }
.bw-pir-sum { font-size: 12px; line-height: 1.45; }
@media (max-width: 719px) {
  .bw-pir { grid-template-columns: 52px minmax(0, 1fr); }
  .bw-pir-status { grid-column: 2; margin-top: 4px; }
  .bw-pir-sum { grid-column: 2; margin-top: 6px; }
}

/* — seven-day strip — */
.bw-days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: 2px solid var(--bw-rule); border-left: 1px solid var(--bw-hair); }
.bw-day { position: relative; padding: 12px 10px 14px; border-right: 1px solid var(--bw-hair); border-bottom: 1px solid var(--bw-hair); display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.bw-day--stacked::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: var(--bw-red); }
.bw-day--stacked { background: var(--bw-surface); }
.bw-day-dow { font-size: 15px; font-weight: 800; letter-spacing: -0.01em; }
.bw-day-date { font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--bw-muted); }
.bw-day-wx { font-size: 11px; font-weight: 600; }
.bw-day-loads { font-size: 11px; line-height: 1.4; color: var(--bw-muted); }
.bw-day-flag { font-size: 9px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--bw-red-ink); }
@media (max-width: 899px) { .bw-days { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (max-width: 539px) { .bw-days { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.bw-days-legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 10px; font-size: 11px; color: var(--bw-muted); align-items: center; }
.bw-sw { display: inline-block; width: 14px; height: 4px; background: var(--bw-red); vertical-align: middle; margin-right: 6px; }

/* — method disclosure — */
.bw-method { border-bottom: 2px solid var(--bw-rule); }
.bw-method > summary { list-style: none; cursor: pointer; padding-block: 14px; display: flex; align-items: center; gap: 12px; }
.bw-method > summary::-webkit-details-marker { display: none; }
.bw-sum-mark { width: 10px; height: 10px; border: 2px solid var(--bw-ink); display: inline-block; position: relative; }
.bw-sum-mark::after { content: ""; position: absolute; inset: 2px; background: var(--bw-ink); transform: scale(0); transition: transform .12s; }
.bw-method[open] .bw-sum-mark::after { transform: scale(1); }
@media (prefers-reduced-motion: reduce) { .bw-sum-mark::after { transition: none; } }
.bw-method-body { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 24px 40px; padding-bottom: 24px; }
@media (max-width: 719px) { .bw-method-body { grid-template-columns: 1fr; } }
.bw-mh { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--bw-muted); padding-bottom: 8px; border-bottom: 2px solid var(--bw-rule); margin-bottom: 4px; }
.bw-mh--spaced { margin-top: 18px; }
.bw-dis { padding: 9px 0; border-bottom: 1px solid var(--bw-hair); display: grid; gap: 3px; }
.bw-dis-title { font-size: 12px; font-weight: 700; }
.bw-dis-verdict { font-size: 10px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--bw-red-ink); }
.bw-dis-note { font-size: 11px; color: var(--bw-muted); line-height: 1.4; }
.bw-plain { padding: 9px 0; border-bottom: 1px solid var(--bw-hair); font-size: 12px; line-height: 1.45; }
.bw-plain--muted { color: var(--bw-muted); }

/* — archive — */
.bw-arch { border-top: 2px solid var(--bw-rule); }
.bw-arch-row { display: grid; grid-template-columns: 150px 96px minmax(0, 1fr) auto; gap: 0 16px; align-items: center; width: 100%; padding: 11px 0; border: none; border-bottom: 1px solid var(--bw-hair); background: none; text-align: left; cursor: pointer; }
.bw-arch-row:hover { background: var(--bw-surface); }
.bw-arch-row[aria-current="true"] { background: var(--bw-surface); box-shadow: inset 4px 0 0 var(--bw-ink); padding-left: 10px; }
.bw-arch-date { font-size: 13px; font-weight: 700; }
.bw-arch-top { font-size: 12px; color: var(--bw-muted); line-height: 1.4; min-width: 0; }
.bw-arch-link { font-size: 10px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; white-space: nowrap; }
@media (max-width: 719px) {
  .bw-arch-row { grid-template-columns: minmax(0, 1fr) auto; }
  .bw-arch-top { grid-column: 1 / -1; }
}

/* — dashboard-only footer of the tab: where the data came from — */
.bw-source { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; padding-block: 14px; font-size: 11px; color: var(--bw-muted); }
.bw-source code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; background: var(--bw-surface); padding: 1px 4px; }

  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: var(--bw-ground); color: var(--bw-ink); font-family: var(--bw-font); font-size: 13px; line-height: 1.45; }
  [hidden] { display: none !important; }

  .hdr { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; padding-block: 20px 14px; border-bottom: 2px solid var(--bw-rule); }
  .hdr-kicker { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; font-size: 10px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--bw-muted); margin-bottom: 6px; }
  .hdr-kicker-rule { width: 24px; height: 2px; background: var(--bw-rule); }
  h1 { margin: 0; font-weight: 800; font-size: clamp(24px, 4vw, 30px); letter-spacing: -0.02em; line-height: 1.05; text-wrap: balance; }
  .hdr-note { font-size: 11px; color: var(--bw-muted); max-width: 44ch; }
  .ftr { padding-block: 16px 28px; font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--bw-muted); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px; }
</style>

<script>
/* Daily Intelligence Briefing — markup builders shared by the dashboard tab
   (js/briefing-watch.js) and the claude.ai artifact page (artifact/build.js
   inlines this file). Pure functions from a briefing record to an escaped
   HTML string; no DOM, no fetching. The record shape is documented in
   data/README.md. */
(function () {
  const TZ = "America/Chicago";
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const safeUrl = u => { try { const p = new URL(String(u)); return /^https?:$/.test(p.protocol) ? p.href : ""; } catch (e) { return ""; } };
  const slug = s => String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, "");

  // "2026-10-20" is a Central calendar date; pin it to noon so no time zone
  // shifts it to the day before.
  const pin = iso => new Date(String(iso) + "T12:00:00");
  const dayLong = iso => { const d = pin(iso); return isNaN(d) ? String(iso || "") : d.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric", year: "numeric" }); };
  const dayShort = iso => { const d = pin(iso); return isNaN(d) ? String(iso || "") : d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }); };
  const dayMd = iso => { const d = pin(iso); return isNaN(d) ? String(iso || "") : d.toLocaleDateString("en-US", { month: "short", day: "numeric" }); };
  const filedAt = iso => { const d = new Date(iso); if (!iso || isNaN(d)) return ""; try { return d.toLocaleTimeString("en-US", { timeZone: TZ, hour: "numeric", minute: "2-digit", timeZoneName: "short" }); } catch (e) { return ""; } };

  const postureChip = (p, big) => {
    const k = slug(p);
    const cls = k === "high" ? "bw-chip--high" : k === "elevated" ? "bw-chip--elevated" : "bw-chip--normal";
    return '<span class="bw-chip ' + cls + '"><span class="bw-chip-dot"></span>' + esc(p || "Normal") + (big ? " posture" : "") + "</span>";
  };
  const statusChip = s => { const k = slug(s); const cls = k === "active" ? "bw-chip--active" : k === "watch" ? "bw-chip--watch" : "bw-chip--quiet"; return '<span class="bw-chip ' + cls + '">' + esc(s || "quiet") + "</span>"; };
  const sevChip = n => { const v = Math.max(1, Math.min(5, Number(n) || 1)); return '<span class="bw-chip bw-chip--sev bw-chip--sev' + v + '">Sev ' + v + "</span>"; };
  const ttdChip = t => { const now = /^now$/i.test(String(t || "")); return '<span class="bw-chip ' + (now ? "bw-chip--now" : "bw-chip--today") + '">' + esc(t || "Today") + "</span>"; };
  const linkOut = (url, text, cls) => { const u = safeUrl(url); return u ? '<a class="' + (cls || "bw-arch-link") + '" href="' + esc(u) + '" target="_blank" rel="noopener noreferrer">' + esc(text) + "</a>" : ""; };

  // The five-field summary the task writes to meta/latest and data/latest.json;
  // derived from a full record when no summary is at hand.
  const headOf = d => d ? { date: d.date, posture: d.posture, top_item: d.top_item, briefing_url: d.briefing_url, published_at: d.published_at } : null;

  /* Inner markup of the posture strip. */
  function latestStrip(head) {
    if (!head) return "";
    const filed = filedAt(head.published_at);
    return '<div class="bw-latest-posture">' + postureChip(head.posture, true) +
        '<span class="bw-caps bw-tnum">' + esc(dayLong(head.date)) + (filed ? " · filed " + esc(filed) : "") + "</span></div>" +
      '<div class="bw-latest-top"><span class="bw-eyebrow">Top item</span><span class="bw-latest-top-text">' + esc(head.top_item || "") + "</span></div>" +
      (safeUrl(head.briefing_url) ? '<a class="bw-btn bw-btn--link" href="' + esc(safeUrl(head.briefing_url)) + '" target="_blank" rel="noopener noreferrer">Open full briefing ↗</a>' : "<span></span>");
  }

  /* Inner markup of the empty state. kind: pending | none | absent | error. */
  function emptyState(kind, detail) {
    if (kind === "absent") return '<div class="bw-empty-title">Sign in to claude.ai to read the briefing.</div>' +
      '<p class="bw-empty-body">The briefing is stored on claude.ai and needs your sign-in.</p>';
    if (kind === "error") return '<div class="bw-empty-title">The briefing could not be read.</div>' +
      '<p class="bw-empty-body">' + esc(detail || "The briefing did not answer.") + " Try again in a few minutes.</p>";
    if (kind === "pending") return '<div class="bw-empty-title">Reading the briefing…</div>' +
      '<p class="bw-empty-body">The briefing is filed each morning at 5:52 AM Central.</p>';
    return '<div class="bw-empty-title">No briefing filed yet.</div>' +
      '<p class="bw-empty-body">The first briefing is filed at 5:52 AM Central.</p>';
  }

  /* The body of one briefing: BLUF, decisions, PIRs, lookahead, method. */
  function body(d) {
    if (!d) return "";
    const items = Array.isArray(d.today_items) ? d.today_items.slice().sort((a, b) => (a.rank || 99) - (b.rank || 99)) : [];
    const pirs = Array.isArray(d.pirs) ? d.pirs.slice().sort((a, b) => (a.pir || 99) - (b.pir || 99)) : [];
    const days = Array.isArray(d.lookahead) ? d.lookahead : [];
    const dissents = Array.isArray(d.dissents) ? d.dissents : [];
    const quiet = Array.isArray(d.lanes_quiet) ? d.lanes_quiet : [];
    const unreachable = Array.isArray(d.unreachable) ? d.unreachable : [];
    const stacked = days.filter(x => x.stacked).length;

    return '<section class="bw-sec bw-band">' +
        '<div class="bw-sec-head"><span class="bw-eyebrow">Bottom line up front · ' + esc(d.title || dayLong(d.date)) + "</span>" +
          (d.run_note ? '<span class="bw-sub">' + esc(d.run_note) + "</span>" : "") + "</div>" +
        '<p class="bw-lede">' + esc(d.bluf || "") + "</p>" +
      "</section>" +

      '<section class="bw-sec bw-band">' +
        '<div class="bw-sec-head"><span class="bw-eyebrow">Decisions today · ' + items.length + (items.length === 1 ? " item" : " items") + '</span><span class="bw-sub">Ranked by urgency. Sev 1 to 5. Now or Today is when to decide.</span></div>' +
        (items.length ? '<div class="bw-dec" role="table" aria-label="Decisions today">' +
          '<div class="bw-dec-h" role="row"><span>#</span><span>Item</span><span>Sev</span><span>Likelihood</span><span>Confidence</span><span>Action</span><span>Owner</span></div>' +
          items.map(it => '<div class="bw-dec-r" role="row">' +
            '<div class="bw-dec-c-rank"><span class="bw-dec-rank bw-tnum">' + esc(it.rank) + "</span></div>" +
            '<div><div class="bw-dec-title">' + (safeUrl(it.source) ? '<a href="' + esc(safeUrl(it.source)) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + "</a>" : esc(it.title)) + "</div>" +
              '<div class="bw-dec-meta">' + ttdChip(it.ttd) + (it.pir ? '<span class="bw-caps">PIR ' + esc(it.pir) + "</span>" : "") + "</div></div>" +
            '<div class="bw-dec-c-sev"><span class="bw-dec-label">Severity</span>' + sevChip(it.severity) + "</div>" +
            '<div><span class="bw-dec-label">Likelihood</span><span class="bw-caps bw-caps--ink">' + esc(it.likelihood || "—") + "</span></div>" +
            '<div><span class="bw-dec-label">Confidence</span><span class="bw-caps bw-caps--ink">' + esc(it.confidence || "—") + "</span></div>" +
            '<div><span class="bw-dec-label">Action</span><div class="bw-dec-action">' + esc(it.action || "") + "</div></div>" +
            '<div><span class="bw-dec-label">Owner</span><div class="bw-dec-owner">' + esc(it.owner || "") + "</div></div>" +
          "</div>").join("") + "</div>"
        : '<p class="bw-sub">No decision items filed for this day.</p>') +
      "</section>" +

      '<section class="bw-sec bw-band">' +
        '<div class="bw-sec-head"><span class="bw-eyebrow">Priority intelligence requirements</span><span class="bw-sub">' + (quiet.length ? "Lanes " + quiet.map(esc).join(", ") + ": nothing to report" : "") + "</span></div>" +
        '<div class="bw-pirs">' + pirs.map(p => '<div class="bw-pir">' +
          '<span class="bw-pir-n">PIR ' + esc(p.pir) + "</span>" +
          '<span class="bw-pir-name">' + esc(p.name) + "</span>" +
          '<span class="bw-pir-status">' + statusChip(p.status) + "</span>" +
          '<span class="bw-pir-sum">' + esc(p.summary || "") + "</span>" +
        "</div>").join("") + "</div>" +
      "</section>" +

      '<section class="bw-sec bw-band">' +
        '<div class="bw-sec-head"><span class="bw-eyebrow">Seven-day lookahead</span><span class="bw-sub">' + (stacked ? stacked + (stacked === 1 ? " stacked day" : " stacked days") + " this week" : "No stacked days this week") + "</span></div>" +
        '<div class="bw-days">' + days.map(x => '<div class="bw-day' + (x.stacked ? " bw-day--stacked" : "") + '">' +
          '<div><div class="bw-day-dow">' + esc(x.dow) + '</div><div class="bw-day-date bw-tnum">' + esc(dayMd(x.date)) + "</div></div>" +
          '<div class="bw-day-wx">' + esc(x.wx || "") + "</div>" +
          '<div class="bw-day-loads">' + esc(x.loads || "") + "</div>" +
          (x.stacked ? '<div class="bw-day-flag">Stacked</div>' : "") +
        "</div>").join("") + "</div>" +
        '<div class="bw-days-legend"><span><span class="bw-sw"></span>Stacked: several events on the same day</span></div>' +
      "</section>" +

      '<details class="bw-method bw-band"><summary><span class="bw-sum-mark"></span><span class="bw-eyebrow bw-caps--ink">How this was judged · dissents, quiet lanes, unreachable sources</span></summary>' +
        '<div class="bw-method-body">' +
          '<div><div class="bw-mh">Dissents · ' + dissents.length + "</div>" +
            (dissents.length ? dissents.map(x => '<div class="bw-dis"><span class="bw-dis-title">' + esc(x.title) + '</span><span class="bw-dis-verdict">' + esc(x.verdict) + '</span><span class="bw-dis-note">' + esc(x.note) + "</span></div>").join("") : '<div class="bw-plain bw-plain--muted">No dissents recorded.</div>') +
          "</div>" +
          "<div>" +
            '<div class="bw-mh">Lanes quiet</div><div class="bw-plain">' + (quiet.length ? quiet.map(n => "PIR " + esc(n)).join(" · ") : "None") + "</div>" +
            '<div class="bw-mh bw-mh--spaced">Unreachable this run · ' + unreachable.length + "</div>" +
            (unreachable.length ? unreachable.map(u => '<div class="bw-plain bw-plain--muted">' + esc(u) + "</div>").join("") : '<div class="bw-plain bw-plain--muted">Every source answered.</div>') +
          "</div>" +
        "</div>" +
      "</details>";
  }

  /* The "showing an older day" bar; empty when the newest is showing. */
  function viewingBar(d, newest) {
    if (!d || !newest || d === newest) return "";
    return '<span class="bw-viewing-text">Showing the briefing for ' + esc(dayShort(d.date)) + "</span>" +
      '<button type="button" class="bw-linkbtn" data-select="">Back to newest ↗</button>';
  }

  /* Inner markup of the archive section. */
  function archive(docs, currentDate) {
    if (!docs || !docs.length) return "";
    return '<div class="bw-sec-head"><span class="bw-eyebrow">Archive · ' + docs.length + (docs.length === 1 ? " briefing" : " briefings") + '</span><span class="bw-sub">Select a day to read it. Newest 30 shown.</span></div>' +
      '<div class="bw-arch">' + docs.map(d => '<button type="button" class="bw-arch-row" data-select="' + esc(d.date) + '"' + (d.date === currentDate ? ' aria-current="true"' : "") + ">" +
        '<span class="bw-arch-date bw-tnum">' + esc(dayShort(d.date)) + "</span>" +
        "<span>" + postureChip(d.posture) + "</span>" +
        '<span class="bw-arch-top">' + esc(d.top_item || "") + "</span>" +
        "<span>" + linkOut(d.briefing_url, "Full briefing ↗") + "</span>" +
      "</button>").join("") + "</div>";
  }

  window.BriefingRender = { esc, safeUrl, dayLong, dayShort, dayMd, filedAt, headOf, postureChip, statusChip, sevChip, latestStrip, emptyState, body, viewingBar, archive };
})();
</script>
<script>
(function () {
  const R = window.BriefingRender;
  const $ = id => document.getElementById(id);

  let latest = null;       // meta/latest
  let docs = [];           // briefings, newest first
  let selected = null;     // date shown in the body; null = newest
  let dbState = "pending"; // pending | ready | absent

  const current = () => docs.length ? ((selected && docs.find(d => d.date === selected)) || docs[0]) : null;

  function render() {
    const head = latest || R.headOf(docs[0]);
    $("latest").hidden = !head;
    if (head) $("latest").innerHTML = R.latestStrip(head);

    const has = !!(latest || docs.length);
    $("empty").hidden = has;
    if (!has) $("empty").innerHTML = R.emptyState(dbState === "absent" ? "absent" : dbState === "pending" ? "pending" : "none");

    const d = current();
    const bar = R.viewingBar(d, docs[0]);
    $("viewing").hidden = !bar;
    $("viewing").innerHTML = bar;
    $("body").innerHTML = d ? R.body(d) : "";

    $("archive").hidden = !docs.length;
    $("archive").innerHTML = R.archive(docs, d && d.date);

    $("stamp").textContent = head && head.published_at ? "Latest filed " + R.dayShort(head.date) + " " + R.filedAt(head.published_at) : "";
  }

  document.addEventListener("click", e => {
    const b = e.target.closest("[data-select]");
    if (!b) return;
    selected = b.getAttribute("data-select") || null;
    render();
    if (b.classList.contains("bw-linkbtn")) window.scrollTo({ top: 0 });
  });

  render();

  // Subscribed once at startup. The page never writes; the briefing task is
  // the only writer.
  (async () => {
    let db = null;
    try { db = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch (e) { db = null; }
    if (!db) { dbState = "absent"; render(); return; }
    dbState = "ready";
    db.doc("meta/latest").onSnapshot(s => { latest = s.exists ? s.data() : null; render(); }, () => { latest = null; render(); });
    db.collection("briefings").orderBy("date", "desc").limit(30).onSnapshot(q => {
      docs = q.docs.map(x => x.data()).filter(x => x && x.date);
      if (selected && !docs.some(x => x.date === selected)) selected = null;
      render();
    }, () => { docs = []; render(); });
    render();
  })();
})();
</script>
