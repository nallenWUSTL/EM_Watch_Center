<title>Daily Intelligence Briefing</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&display=swap">
<style>
  /* GENERATED by artifact/build.js from artifact/template.html, css/briefing.css
     and js/briefing-render.js. Edit those files, run `node artifact/build.js`,
     then republish briefing-watch.html. */

  /* Layout: one column of ruled bands in the Watch Desk's Modernist system —
     header strip, decisions table, PIR rows, seven-day strip, method, archive.
     Dark values for the shared --bw-* tokens live here; the dashboard is
     light-only and never defines them. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bw-ground: #1b1a19; --bw-surface: #262423; --bw-ink: #f3f2f2; --bw-muted: #aaa6a5; --bw-hair: #3b3836;
      --bw-rule: rgba(243, 242, 242, 0.35); --bw-red: #ff6a51; --bw-red-ink: #ff8f7a;
      --bw-amber: #d9a33a; --bw-amber-wash: #42330f; --bw-green: #4fbf86; --bw-green-wash: #163826;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bw-ground: #1b1a19; --bw-surface: #262423; --bw-ink: #f3f2f2; --bw-muted: #aaa6a5; --bw-hair: #3b3836;
    --bw-rule: rgba(243, 242, 242, 0.35); --bw-red: #ff6a51; --bw-red-ink: #ff8f7a;
    --bw-amber: #d9a33a; --bw-amber-wash: #42330f; --bw-green: #4fbf86; --bw-green-wash: #163826;
    color-scheme: dark;
  }

  /*__BRIEFING_CSS__*/

  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: var(--bw-ground); color: var(--bw-ink); font-family: var(--bw-font); font-size: 13px; line-height: 1.45; }
  [hidden] { display: none !important; }

  .hdr { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; padding-block: 20px 14px; border-bottom: 2px solid var(--bw-rule); }
  .hdr-kicker { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; font-size: 10px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--bw-muted); margin-bottom: 6px; }
  .hdr-kicker-rule { width: 24px; height: 2px; background: var(--bw-rule); }
  h1 { margin: 0; font-weight: 800; font-size: clamp(24px, 4vw, 30px); letter-spacing: -0.02em; line-height: 1.05; text-wrap: balance; }
  .hdr-note { font-size: 11px; color: var(--bw-muted); max-width: 44ch; }
  .ftr { padding-block: 16px 28px; font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--bw-muted); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px; }
</style>

<div class="bw">
<header class="hdr bw-band">
  <div>
    <div class="hdr-kicker">
      <span>Washington University in St. Louis</span>
      <span class="hdr-kicker-rule"></span>
      <span>Emergency Management · EOC Watch Desk</span>
    </div>
    <h1>Daily Intelligence Briefing</h1>
  </div>
  <p class="hdr-note">Filed each morning at 5:52 AM Central. Open the full briefing for sources and detail.</p>
</header>

<div id="latest" class="bw-latest bw-band" hidden></div>
<div id="empty" class="bw-empty bw-band"></div>
<div id="viewing" class="bw-viewing bw-band" hidden></div>
<main id="body"></main>
<section id="archive" class="bw-sec bw-band" hidden></section>

<footer class="ftr bw-band">
  <span>Read-only · filed by the briefing task</span>
  <span id="stamp"></span>
</footer>
</div>

<script>
//__BRIEFING_RENDER__
</script>
<script>
(function () {
  const R = window.BriefingRender;
  const $ = id => document.getElementById(id);

  let latest = null;       // meta/latest
  let docs = [];           // briefings, newest first
  let selected = null;     // date shown in the body; null = newest
  let dbState = "pending"; // pending | ready | absent

  const current = () => docs.length ? ((selected && docs.find(d => d.date === selected)) || docs[0]) : null;

  function render() {
    const head = latest || R.headOf(docs[0]);
    $("latest").hidden = !head;
    if (head) $("latest").innerHTML = R.latestStrip(head);

    const has = !!(latest || docs.length);
    $("empty").hidden = has;
    if (!has) $("empty").innerHTML = R.emptyState(dbState === "absent" ? "absent" : dbState === "pending" ? "pending" : "none");

    const d = current();
    const bar = R.viewingBar(d, docs[0]);
    $("viewing").hidden = !bar;
    $("viewing").innerHTML = bar;
    $("body").innerHTML = d ? R.body(d) : "";

    $("archive").hidden = !docs.length;
    $("archive").innerHTML = R.archive(docs, d && d.date);

    $("stamp").textContent = head && head.published_at ? "Latest filed " + R.dayShort(head.date) + " " + R.filedAt(head.published_at) : "";
  }

  document.addEventListener("click", e => {
    const b = e.target.closest("[data-select]");
    if (!b) return;
    selected = b.getAttribute("data-select") || null;
    render();
    if (b.classList.contains("bw-linkbtn")) window.scrollTo({ top: 0 });
  });

  render();

  // Subscribed once at startup. The page never writes; the briefing task is
  // the only writer.
  (async () => {
    let db = null;
    try { db = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch (e) { db = null; }
    if (!db) { dbState = "absent"; render(); return; }
    dbState = "ready";
    db.doc("meta/latest").onSnapshot(s => { latest = s.exists ? s.data() : null; render(); }, () => { latest = null; render(); });
    db.collection("briefings").orderBy("date", "desc").limit(30).onSnapshot(q => {
      docs = q.docs.map(x => x.data()).filter(x => x && x.date);
      if (selected && !docs.some(x => x.date === selected)) selected = null;
      render();
    }, () => { docs = []; render(); });
    render();
  })();
})();
</script>
