document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f3f2f2;\n  --color-surface: #eae9e9;\n  --color-text: #201e1d;\n  --color-accent: #ec3013;\n  --color-accent-2: #e15b47;\n  --color-divider: color-mix(in srgb, #201e1d 40%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f8f4f4;\n  --color-neutral-200: #eae7e7;\n  --color-neutral-300: #d7d3d3;\n  --color-neutral-400: #bab6b6;\n  --color-neutral-500: #9b9797;\n  --color-neutral-600: #7d7979;\n  --color-neutral-700: #605d5d;\n  --color-neutral-800: #444141;\n  --color-neutral-900: #2d2b2b;\n\n  --color-accent-100: #fff2ef;\n  --color-accent-200: #ffe0d9;\n  --color-accent-300: #ffc4b8;\n  --color-accent-400: #ff9783;\n  --color-accent-500: #ff563c;\n  --color-accent-600: #dd2b0f;\n  --color-accent-700: #ae1800;\n  --color-accent-800: #7c1405;\n  --color-accent-900: #4d170e;\n\n  --color-accent-2-100: #fff2ef;\n  --color-accent-2-200: #ffe0da;\n  --color-accent-2-300: #ffc4b9;\n  --color-accent-2-400: #ff9784;\n  --color-accent-2-500: #ef6853;\n  --color-accent-2-600: #c94b39;\n  --color-accent-2-700: #9e3526;\n  --color-accent-2-800: #71261b;\n  --color-accent-2-900: #471d16;\n\n  --font-heading: \"Archivo\", system-ui, sans-serif;\n  --font-heading-weight: 800;\n  --font-body: \"Archivo\", system-ui, sans-serif;\n\n  --space-1: 4.0px;\n  --space-2: 8.0px;\n  --space-3: 12.0px;\n  --space-4: 16.0px;\n  --space-6: 24.0px;\n  --space-8: 32.0px;\n\n  --radius-sm: 0px;\n  --radius-md: 0px;\n  --radius-lg: 0px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2d2b2b 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2d2b2b 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.grayscale{filter:grayscale(1) contrast(1.08)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 2px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); justify-content: flex-start; text-align: left; }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: 2px solid var(--color-divider);\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 2px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid var(--color-divider);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg); -100%) } }\n  .leaflet-container { font-family: \"Archivo\", system-ui, sans-serif; }\n  .leaflet-control-layers { border-radius: 0 !important; border: 2px solid rgba(32,30,29,0.4) !important; background: #f3f2f2 !important; padding: 10px !important; font-size: 11px !important; font-weight: 700 !important; letter-spacing: 0.06em !important; text-transform: uppercase !important; }\n  .leaflet-control-layers-overlays label { margin-bottom: 5px; cursor: pointer; }\n  .leaflet-control-layers input { accent-color: #ec3013; }\n  .leaflet-bar a, .leaflet-tooltip, .leaflet-popup-content-wrapper { border-radius: 0 !important; }\n  .leaflet-tooltip { border: 2px solid #201e1d !important; font-weight: 700 !important; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-width: 1280px; background: #f3f2f2; color: #201e1d; font-family: 'Archivo', system-ui, sans-serif; font-size: 13px; line-height: 1.45;\">\n\n  <header style=\"display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 24px; padding: 20px 32px 14px; border-bottom: 2px solid rgba(32,30,29,0.4);\">\n    <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n      <div style=\"display: flex; align-items: center; gap: 12px; font-size: 10px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #605d5d;\">\n        <span>Washington University in St. Louis<\u002Fspan>\n        <span style=\"width: 24px; height: 2px; background: rgba(32,30,29,0.4);\"><\u002Fspan>\n        <span>Emergency Management · EOC Watch Desk<\u002Fspan>\n      <\u002Fdiv>\n      <h1 style=\"margin: 0; font-family: 'Archivo', system-ui, sans-serif; font-weight: 800; font-size: 30px; letter-spacing: -0.02em; line-height: 1.05;\">{{ pageTitle }}<\u002Fh1>\n    <\u002Fdiv>\n    <sc-if value=\"{{ isHazards }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"display: flex; align-items: center; gap: 20px;\">\n      <div style=\"display: flex; flex-direction: column; gap: 3px; text-align: right;\">\n  uppercase; color: #605d5d; margin-bottom: 16px;\">Regional Alert Inventory · NWS CAP, State of Missouri<\u002Fdiv>\n        <sc-raw-table class=\"table\" style=\"width: 100%; font-size: 12px;\">\n          <sc-raw-thead>\n            <sc-raw-tr>\n              <sc-raw-th style=\"text-align: left;\">Event<\u002Fsc-raw-th>\n              <sc-raw-th style=\"text-align: right;\">Active<\u002Fsc-raw-th>\n              <sc-raw-th style=\"text-align: left;\">Highest severity<\u002Fsc-raw-th>\n              <sc-raw-th style=\"text-align: left;\">Campus polygons affected<\u002Fsc-raw-th>\n            <\u002Fsc-raw-tr>\n          <\u002Fsc-raw-thead>\n          <sc-raw-tbody>\n            <sc-for list=\"{{ inventory }}\" as=\"i\">\n              <sc-raw-tr>\n                <sc-raw-td style=\"font-weight: 600;\">{{ i.event }}<\u002Fsc-raw-td>\n                <sc-raw-td style=\"text-align: right; font-variant-numeric: tabular-nums;\">{{ i.count }}<\u002Fsc-raw-td>\n                <sc-raw-td style=\"color: #605d5d;\">{{ i.severity }}<\u002Fsc-raw-td>\n                <sc-raw-td style=\"color: {{ i.tone }}; font-weight: 600;\">{{ i.campus }}<\u002Fsc-raw-td>\n              <\u002Fsc-raw-tr>\n            <\u002Fsc-for>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table>\n        <div style=\"font-size: 11px; color: #605d5d; margin-top: 10px;\">{{ inventoryNote }}<\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"padding: 20px 32px 28px; border-bottom: 2px solid rgba(32,30,29,0.4);\">\n        <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: 4px;\">\n          <div style=\"font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #605d5d;\">Flood Stages · NOAA NWPS<\u002Fdiv>\n          <a href=\"https://water.noaa.gov/wfo/LSX\" target=\"_blank\" style=\"font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;\">Open water.noaa.gov ↗<\u002Fa>\n        <\u002Fdiv>\n        <div style=\"font-size: 11px; color: #605d5d; margin-bottom: 6px; max-width: 92ch; line-height: 1.5;\">{{ floodNote }}<\u002Fdiv>\n\n        <sc-if value=\"{{ floodHeadline }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display: inline-block; padding: 5px 10px; margin-bottom: 14px; background: #ec3013; color: #f3f2f2; font-size: 11px; font-weight: 700; letter-spacing: 0.06em;\">{{ floodHeadline }}<\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ floodQuiet }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font-size: 12px; color: #605d5d; margin-bottom: 14px;\">Every reporting gauge is below action stage, and no forecast crosses it. The gauges answered — this is a real reading.<\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ floodReady }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 0 36px; border-top: 2px solid rgba(32,30,29,0.4);\">\n            <sc-for list=\"{{ floodRows }}\" as=\"g\" hint-placeholder-count=\"6\">\n              <div style=\"display: flex; flex-direction: column; gap: 6px; padding: 14px 0 15px; border-bottom: 1px solid #d7d3d3;\">\n                <div style=\"display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: baseline;\">\n                  <span style=\"display: flex; flex-direction: column; gap: 2px; min-width: 0;\">\n                    <span style=\"font-size: 13px; font-weight: 700;\">{{ g.label }}<\u002Fspan>\n                    <span style=\"font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: #605d5d;\">{{ g.note }}<\u002Fspan>\n                  <\u002Fspan>\n                  <span style=\"display: flex; flex-direction: column; gap: 2px; text-align: right; white-space: nowrap;\">\n                    <span style=\"font-family: Archivo, sans-serif; font-size: 22px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums;\">{{ g.stage }}<\u002Fspan>\n                    <span style=\"font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: {{ g.categoryTone }};\">{{ g.category }}<\u002Fspan>\n                  <\u002Fspan>\n                <\u002Fdiv>\n\n                <div style=\"position: relative; height: 10px; background: #eae9e9; border: 1px solid #d7d3d3;\">\n                  <span style=\"position: absolute; left: 0; top: 0; bottom: 0; width: {{ g.barWidth }}; background: {{ g.barTone }};\"><\u002Fspan>\n                  <span style=\"position: absolute; top: -2px; bottom: -2px; left: {{ g.actionMark }}; width: 2px; background: #b8860b;\"><\u002Fspan>\n                  <span style=\"position: absolute; top: -2px; bottom: -2px; left: {{ g.minorMark }}; width: 2px; background: #ec3013;\"><\u002Fspan>\n                  <span style=\"position: absolute; top: -2px; bottom: -2px; left: {{ g.majorMark }}; width: 2px; background: #201e1d;\"><\u002Fspan>\n                <\u002Fdiv>\n\n                <div style=\"display: flex; flex-wrap: wrap; gap: 3px 16px; font-size: 11px;\">\n                  <span style=\"color: {{ g.headroomTone }}; font-weight: 600;\">{{ g.headroom }}<\u002Fspan>\n                  <span style=\"color: {{ g.forecastTone }};\">{{ g.forecast }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: #605d5d;\">{{ g.scaleLabel }} · Observed {{ g.observedAt }}{{ g.detail }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-wrap: wrap; gap: 18px; margin-top: 14px; font-size: 11px; color: #605d5d;\">\n            <span style=\"display: flex; align-items: center; gap: 6px;\"><span style=\"width: 2px; height: 12px; background: #b8860b;\"><\u002Fspan>Action stage<\u002Fspan>\n            <span style=\"display: flex; align-items: center; gap: 6px;\"><span style=\"width: 2px; height: 12px; background: #ec3013;\"><\u002Fspan>Minor flood stage<\u002Fspan>\n            <span style=\"display: flex; align-items: center; gap: 6px;\"><span style=\"width: 2px; height: 12px; background: #201e1d;\"><\u002Fspan>Major flood stage<\u002Fspan>\n            <span>Bars are scaled to each site's own major flood stage — stage values are not comparable between gauges.<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fsection>\n\n      <section style=\"padding: 20px 32px 28px;\">\n        <div style=\"font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #605d5d; margin-bottom: 4px;\">Open-Source News Monitor · GDELT Web NGrams<\u002Fdiv>\n        <div style=\"font-size: 11px; color: #605d5d; margin-bottom: 16px;\">{{ newsSource }}<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column;\">\n          <sc-for list=\"{{ news }}\" as=\"n\" hint-placeholder-count=\"6\">\n            <div style=\"display: grid; grid-template-columns: 1fr 200px; gap: 20px; align-items: baseline; padding: 11px 0; border-bottom: 1px solid #d7d3d3;\">\n              <a href=\"{{ n.url }}\" target=\"_blank\" style=\"font-size: 13px; font-weight: 600; line-height: 1.4;\">{{ n.title }}<\u002Fa>\n              <span style=\"display: flex; flex-direction: column; gap: 2px; text-align: right; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: #605d5d;\">\n                <span>{{ n.meta }}<\u002Fspan>\n                <span style=\"letter-spacing: 0.04em; text-transform: none;\">{{ n.why }}<\u002Fspan>\n              <\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n\n      <section style=\"padding: 20px 32px 28px; border-top: 2px solid rgba(32,30,29,0.4);\">\n        <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: 4px;\">\n          <div style=\"font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #605d5d;\">Transit · Metro GTFS-RT<\u002Fdiv>\n          <a href=\"https://www.metrostlouis.org/rider-alerts/\" target=\"_blank\" style=\"font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;\">Open metrostlouis.org ↗<\u002Fa>\n        <\u002Fdiv>\n        <div style=\"font-size: 11px; color: #605d5d; margin-bottom: 18px; max-width: 92ch; line-height: 1.5;\">{{ metroNote }}<\u002Fdiv>\n\n        <sc-if value=\"{{ metroReady }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display: grid; grid-template-columns: repeat(4, 1fr); border-top: 2px solid rgba(32,30,29,0.4); border-bottom: 2px solid rgba(32,30,29,0.4); margin-bottom: 22px;\">\n            <sc-for list=\"{{ metroStats }}\" as=\"m\" hint-placeholder-count=\"4\">\n              <div style=\"display: flex; flex-direction: column; gap: 4px; padding: 14px 18px 14px 0;\">\n                <span style=\"font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #605d5d;\">{{ m.label }}<\u002Fspan>\n                <span style=\"font-family: Archivo, sans-serif; font-size: 30px; font-weight: 700; line-height: 1;\">{{ m.value }}<\u002Fspan>\n                <span style=\"font-size: 11px; color: #605d5d;\">{{ m.note }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ metroQuiet }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-size: 12px; color: #605d5d;\">No active service alerts and no route running a median delay of a minute or more. The feeds answered — the system is running to schedule.<\u002Fdiv>\n          <\u002Fsc-if>\n\n          <div style=\"display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 32px;\">\n            <div style=\"display: flex; flex-direction: column; min-width: 0;\">\n              <sc-if value=\"{{ metroAlerts }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #605d5d; padding-bottom: 8px; border-bottom: 2px solid rgba(32,30,29,0.4);\">Service alerts<\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-for list=\"{{ metroAlerts }}\" as=\"a\" hint-placeholder-count=\"3\">\n                <div style=\"display: flex; flex-direction: column; gap: 4px; padding: 11px 0; border-bottom: 1px solid #d7d3d3;\">\n                  <span style=\"font-size: 13px; font-weight: 700; line-height: 1.35; text-wrap: pretty;\">{{ a.header }}<\u002Fspan>\n                  <span style=\"font-size: 11px; color: #605d5d; line-height: 1.45;\">{{ a.description }}<\u002Fspan>\n                  <span style=\"display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase;\">\n                    <span style=\"color: {{ a.tagTone }}; font-weight: 700;\">{{ a.tag }}<\u002Fspan>\n                    <span style=\"color: #605d5d;\">{{ a.routes }}<\u002Fspan>\n                  <\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <div style=\"display: flex; flex-direction: column; min-width: 0;\">\n              <sc-if value=\"{{ metroDelays }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #605d5d; padding-bottom: 8px; border-bottom: 2px solid rgba(32,30,29,0.4);\">Routes running late<\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-for list=\"{{ metroDelays }}\" as=\"d\" hint-placeholder-count=\"5\">\n                <div style=\"display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: baseline; padding: 9px 0; border-bottom: 1px solid #d7d3d3;\">\n                  <span style=\"display: flex; flex-direction: column; gap: 2px; min-width: 0;\">\n                    <span style=\"font-size: 12px; font-weight: 700;\">{{ d.route }}<\u002Fspan>\n                    <span style=\"font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: #605d5d;\">{{ d.detail }}<\u002Fspan>\n                  <\u002Fspan>\n                  <span style=\"font-size: 15px; font-weight: 700; color: {{ d.tone }}; font-variant-numeric: tabular-nums;\">{{ d.median }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ metroNotes }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-size: 11px; color: #ae1800; margin-top: 12px;\">{{ metroNotes }}<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fsc-if>\n      <\u002Fsection>\n\n      <section style=\"padding: 20px 32px 28px; border-top: 2px solid rgba(32,30,29,0.4);\">\n        <div style=\"font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #605d5d; margin-bottom: 4px;\">Local Outlets · St. Louis Newsroom RSS<\u002Fdiv>\n        <div style=\"font-size: 11px; color: #605d5d; margin-bottom: 18px; max-width: 92ch; line-height: 1.5;\">{{ localNote }}<\u002Fdiv>\n\n        <sc-if value=\"{{ localEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font-size: 12px; color: #605d5d;\">No St. Louis outlet published a hazard or campus-area story in the window. The feeds answered — this is a real reading, not a gap.<\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ localReady }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 0 32px;\">\n            <sc-for list=\"{{ localItems }}\" as=\"i\" hint-placeholder-count=\"6\">\n              <div style=\"display: flex; flex-direction: column; gap: 4px; padding: 11px 0; border-bottom: 1px solid #d7d3d3;\">\n                <a href=\"{{ i.url }}\" target=\"_blank\" style=\"font-size: 13px; font-weight: 700; line-height: 1.4; text-wrap: pretty;\">{{ i.title }}<\u002Fa>\n                <span style=\"display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: #605d5d;\">\n                  <span>{{ i.meta }}<\u002Fspan>\n                  <span style=\"color: {{ i.whyTone }}; font-weight: 700;\">{{ i.why }}<\u002Fspan>\n                <\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <sc-if value=\"{{ localQuiet }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-size: 11px; color: #605d5d; margin-top: 12px;\">Not answering: {{ localQuiet }}<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fsc-if>\n      <\u002Fsection>\n\n\n      <section style=\"padding: 20px 32px 28px; border-top: 2px solid rgba(32,30,29,0.4);\">\n        <div style=\"font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #605d5d; margin-bottom: 4px;\">Thematic Classification · GDELT GKG 2.0<\u002Fdiv>\n        <div style=\"font-size: 11px; color: #605d5d; margin-bottom: 18px;\">{{ gkgNote }}<\u002Fdiv>\n\n        <div style=\"display: flex; flex-direction: column; gap: 26px;\">\n          <div style=\"display: flex; flex-direction: column; gap: 9px; min-width: 0;\">\n            <div style=\"font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #605d5d; padding-bottom: 8px; border-bottom: 2px solid rgba(32,30,29,0.4);\">Hazard themes in window<\u002Fdiv>\n            <sc-if value=\"{{ gkgSingleNote }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font-size: 11px; color: #605d5d; padding-bottom: 2px;\">Each theme appears once in this window — counts listed rather than charted.<\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-for list=\"{{ gkgThemes }}\" as=\"t\" hint-placeholder-count=\"6\">\n              <div style=\"display: grid; grid-template-columns: minmax(0, 1fr) 28px; gap: 10px; align-items: center; min-width: 0;\">\n                <div style=\"display: flex; flex-direction: column; gap: 3px; min-width: 0;\">\n                  <span style=\"font-size: 11px; font-weight: 600;\">{{ t.label }}<\u002Fspan>\n                  <sc-if value=\"{{ gkgShowBars }}\" hint-placeholder-val=\"{{ false }}\">\n                    <span style=\"height: 6px; background: #ec3013; width: {{ t.width }};\"><\u002Fspan>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n                <span style=\"font-size: 12px; font-weight: 700; text-align: right;\">{{ t.count }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"display: flex; flex-direction: column; min-width: 0;\">\n            <div style=\"font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #605d5d; padding-bottom: 8px; border-bottom: 2px solid rgba(32,30,29,0.4);\">Geo-tagged coverage · tone scored<\u002Fdiv>\n            <sc-for list=\"{{ gkgRecords }}\" as=\"g\" hint-placeholder-count=\"5\">\n              <div style=\"display: flex; flex-direction: column; gap: 5px; padding: 12px 0; border-bottom: 1px solid #d7d3d3; min-width: 0;\">\n                <a href=\"{{ g.url }}\" target=\"_blank\" style=\"font-size: 13px; font-weight: 600; line-height: 1.4; text-wrap: pretty;\">{{ g.slug }}<\u002Fa>\n                <span style=\"font-size: 11px; color: #605d5d; line-height: 1.45;\">{{ g.themes }}<\u002Fspan>\n                <span style=\"display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: #605d5d;\">\n                  <span>{{ g.source }}<\u002Fspan>\n                  <span style=\"letter-spacing: 0.03em; text-transform: none;\">{{ g.place }}<\u002Fspan>\n                  <span style=\"letter-spacing: 0.03em; text-transform: none; font-weight: 700; color: {{ g.toneColor }};\">{{ g.tone }}<\u002Fspan>\n                <\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <sc-if value=\"{{ gkgEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font-size: 12px; color: #605d5d; padding: 14px 0;\">No hazard-themed coverage geo-tagged to the St. Louis region in this window. Themes are counted only where GDELT's own geocoder placed the article here.<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fmain>\n\n    <aside style=\"border-left: 2px solid rgba(32,30,29,0.4);\">\n      <div style=\"padding: 18px 32px 14px 20px; border-bottom: 2px solid rgba(32,30,29,0.4);\">\n        <div style=\"font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #605d5d; margin-bottom: 4px;\">Feed Registry<\u002Fdiv>\n        <div style=\"font-size: 11px; color: #605d5d;\">{{ registryNote }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <sc-for list=\"{{ registry }}\" as=\"r\" hint-placeholder-count=\"14\">\n          <div style=\"display: grid; grid-template-columns: 10px 1fr auto; gap: 12px; align-items: start; padding: 13px 32px 13px 20px; border-bottom: 1px solid #d7d3d3;\">\n            <span style=\"width: 10px; height: 10px; margin-top: 4px; background: {{ r.dot }};\"><\u002Fspan>\n            <div style=\"display: flex; flex-direction: column; gap: 3px;\">\n              <span style=\"font-size: 13px; font-weight: 700;\">{{ r.name }}<\u002Fspan>\n              <span style=\"font-size: 11px; color: #605d5d; word-break: break-all;\">{{ r.endpoint }}<\u002Fspan>\n              <span style=\"font-size: 11px; color: {{ r.tone }};\">{{ r.detail }}<\u002Fspan>\n            <\u002Fdiv>\n            <span style=\"font-size: 9px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; padding: 3px 6px; background: {{ r.chipBg }}; color: {{ r.chipFg }}; white-space: nowrap;\">{{ r.status }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"padding: 18px 32px 28px 20px;\">\n        <div style=\"font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #605d5d; margin-bottom: 8px;\">To connect the remaining feeds<\u002Fdiv>\n        <p style=\"margin: 0 0 8px; font-size: 12px; line-height: 1.55; color: #444141;\">Social platforms and campus CAD both either require credentials or block direct browser requests. Each needs a small server-side collector that authenticates, normalizes and re-serves the payload to this page.<\u002Fp>\n        <p style=\"margin: 0; font-size: 12px; line-height: 1.55; color: #444141;\">Ameren and MoDOT took that route and are live above — Ameren through the outage-map scraper, MoDOT directly. The feeds still listed here have no panel yet rather than an empty one; nothing is displayed until its source is connected.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Faside>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"display: {{ weatherDisplay }};\">\n    <div style=\"display: flex; align-items: center; gap: 14px; padding: 10px 32px; background: #201e1d; color: #f3f2f2; border-bottom: 2px solid #201e1d;\">\n      <span style=\"font-size: 10px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; padding: 4px 8px; background: #f3f2f2; color: #201e1d;\">Live NWS Feed<\u002Fspan>\n      <span style=\"font-size: 12px; font-weight: 600;\">National active-alert feed, polled every 30 seconds. A Tornado Warning polygon intersecting the 5-mile ring around Brookings Hall raises a full-screen notification prompt with the Alertus launch link.<\u002Fspan>\n    <\u002Fdiv>\n    <x-import component-from-global-scope=\"weather-monitor\" from=\"bfd278ac-ea85-41d7-83f3-2fcbf5855ee5#/weather-monitor.js\" hint-size=\"100%,900px\"><\u002Fx-import>\n  <\u002Fdiv>\n\n  <div style=\"display: {{ outagesDisplay }};\">\n    <div style=\"display: flex; align-items: center; gap: 14px; padding: 10px 32px; background: #201e1d; color: #f3f2f2; border-bottom: 2px solid #201e1d;\">\n      <span style=\"font-size: 10px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; padding: 4px 8px; background: #f3f2f2; color: #201e1d;\">Utility Outages<\u002Fspan>\n      <span style=\"font-size: 12px; font-weight: 600;\">Ameren outage data is scraped from the utility's own published map and summarised here, read through the proxy — the panel names the host when it cannot be reached. Missouri American Water's advisory map is embedded live below and needs no proxy.<\u002Fspan>\n    <\u002Fdiv>\n\n    <section style=\"padding: 22px 32px 30px;\">\n        <div style=\"font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #605d5d; margin-bottom: 4px;\">Power · Ameren Missouri and Ameren Illinois<\u002Fdiv>\n        <div style=\"font-size: 11px; color: #605d5d; margin-bottom: 18px;\">{{ powerNote }}<\u002Fdiv>\n\n        <sc-if value=\"{{ powerStorm }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display: flex; align-items: baseline; gap: 12px; padding: 10px 14px; margin-bottom: 18px; background: #ec3013; color: #f3f2f2;\">\n            <span style=\"font-size: 10px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase;\">Storm Mode<\u002Fspan>\n            <span style=\"font-size: 12px; font-weight: 600;\">Ameren has switched the public map to storm posture — restoration estimates are suspended or generalised.<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ proxyPanel }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; margin-bottom: 18px; border: 2px solid #201e1d;\">\n            <span style=\"display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;\">\n              <span style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;\">Proxy origin<\u002Fspan>\n              <span style=\"font-size: 11px; color: #605d5d;\">Currently {{ proxyHost }}<\u002Fspan>\n            <\u002Fspan>\n            <span style=\"font-size: 12px; color: #605d5d; line-height: 1.5; max-width: 70ch;\">{{ proxyPanelNote }}<\u002Fspan>\n            <div style=\"display: flex; gap: 10px; align-items: center; flex-wrap: wrap;\">\n              <input value=\"{{ proxyDraft }}\" sc-camel-on-change=\"{{ onProxyInput }}\" placeholder=\"https://feeds.example.org\" style=\"flex: 1 1 320px; min-width: 0; padding: 9px 11px; font-family: Archivo, sans-serif; font-size: 12px; color: #201e1d; background: #f3f2f2; border: 2px solid #201e1d; border-radius: 0;\">\n              <button sc-camel-on-click=\"{{ onProxySave }}\" style=\"padding: 9px 16px; font-family: Archivo, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; text-align: left; color: #f3f2f2; background: #ec3013; border: none; border-radius: 0; cursor: pointer;\" style-hover=\"{ background: '#c92a10' }\">Use this origin<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ onProxyReset }}\" style=\"padding: 9px 16px; font-family: Archivo, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; text-align: left; color: #201e1d; background: transparent; border: 2px solid #201e1d; border-radius: 0; cursor: pointer;\" style-hover=\"{ background: 'rgba(32,30,29,0.06)' }\">Reset<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ powerReady }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display: grid; grid-template-columns: repeat(4, 1fr); border-top: 2px solid rgba(32,30,29,0.4); border-bottom: 2px solid rgba(32,30,29,0.4); margin-bottom: 22px;\">\n            <sc-for list=\"{{ powerStats }}\" as=\"p\" hint-placeholder-count=\"4\">\n              <div style=\"display: flex; flex-direction: column; gap: 4px; padding: 14px 18px 14px 0;\">\n                <span style=\"font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #605d5d;\">{{ p.label }}<\u002Fspan>\n                <span style=\"font-family: Archivo, sans-serif; font-size: 30px; font-weight: 700; line-height: 1;\">{{ p.value }}<\u002Fspan>\n                <span style=\"font-size: 11px; color: #605d5d;\">{{ p.note }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 32px;\">\n            <div style=\"display: flex; flex-direction: column; min-width: 0;\">\n              <div style=\"font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #605d5d; padding-bottom: 8px; border-bottom: 2px solid rgba(32,30,29,0.4);\">Nearest outages<\u002Fdiv>\n              <sc-for list=\"{{ powerOutages }}\" as=\"o\" hint-placeholder-count=\"5\">\n                <div style=\"display: flex; flex-direction: column; gap: 4px; padding: 11px 0; border-bottom: 1px solid #d7d3d3;\">\n                  <span style=\"font-size: 13px; font-weight: 700;\">{{ o.headline }}<\u002Fspan>\n                  <span style=\"font-size: 11px; color: #605d5d;\">{{ o.cause }} — {{ o.crew }}<\u002Fspan>\n                  <span style=\"display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase;\">\n                    <span style=\"color: {{ o.etrTone }}; font-weight: 700;\">{{ o.etr }}<\u002Fspan>\n                    <span style=\"color: #605d5d;\">{{ o.duration }}<\u002Fspan>\n                  <\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <div style=\"font-size: 11px; color: #605d5d; padding-top: 12px;\">Causes in ring: {{ powerCauses }}<\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display: flex; flex-direction: column; min-width: 0;\">\n              <div style=\"font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #605d5d; padding-bottom: 8px; border-bottom: 2px solid rgba(32,30,29,0.4);\">Metro counties<\u002Fdiv>\n              <sc-for list=\"{{ powerCounties }}\" as=\"c\" hint-placeholder-count=\"8\">\n                <div style=\"display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: baseline; padding: 9px 0; border-bottom: 1px solid #d7d3d3;\">\n                  <span style=\"display: flex; flex-direction: column; gap: 2px; min-width: 0;\">\n                    <span style=\"font-size: 12px; font-weight: 600;\">{{ c.name }}<\u002Fspan>\n                    <span style=\"font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: #605d5d;\">{{ c.served }}<\u002Fspan>\n                  <\u002Fspan>\n                  <span style=\"display: flex; flex-direction: column; gap: 2px; text-align: right;\">\n                    <span style=\"font-size: 15px; font-weight: 700; color: {{ c.tone }};\">{{ c.out }}<\u002Fspan>\n                    <span style=\"font-size: 10px; color: #605d5d;\">{{ c.pct }}<\u002Fspan>\n                  <\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fsection>\n\n\n\n\n    <section style=\"padding: 22px 32px 30px; border-top: 2px solid rgba(32,30,29,0.4);\">\n      <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: 4px;\">\n        <div style=\"font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #605d5d;\">Water · Missouri American Water<\u002Fdiv>\n        <a href=\"https://awgis.amwater.com/CustomerAdvisoryMap/\" target=\"_blank\" style=\"font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;\">Open awgis.amwater.com ↗<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"font-size: 13px; font-weight: 700; margin-bottom: 3px;\">Customer advisory map<\u002Fdiv>\n      <div style=\"font-size: 11px; color: #605d5d; margin-bottom: 14px; max-width: 92ch; line-height: 1.5;\">Missouri American Water serves St. Louis County, including the Danforth and West campuses. Advisories here cover main breaks, boil-water notices and planned work. Boil-water notices are the item with direct campus consequence — food service, labs and clinical operations.<\u002Fdiv>\n      <div style=\"position: relative; border: 2px solid #201e1d; background: #eae9e9;\">\n        <iframe src=\"https://awgis.amwater.com/CustomerAdvisoryMap/\" title=\"Customer advisory map\" loading=\"lazy\" referrerpolicy=\"no-referrer-when-downgrade\" style=\"display: block; width: 100%; height: 620px; border: none;\"><\u002Fiframe>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n  <\u002Fdiv>\n\n  <div style=\"display: {{ roadsDisplay }};\">\n    <x-import component-from-global-scope=\"road-conditions\" from=\"c0dd877f-38e3-49fb-9336-580f8db73724#/road-conditions.js\" hint-size=\"100%,900px\"><\u002Fx-import>\n  <\u002Fdiv>\n\n  <footer style=\"display: grid; grid-template-columns: 1fr auto; gap: 24px; padding: 16px 32px 28px; border-top: 2px solid rgba(32,30,29,0.4); font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #605d5d;\">\n    <span>Live public data · No credentials stored · Machine-composed summary requires analyst confirmation before release<\u002Fspan>\n    <span>{{ retrievedFull }}<\u002Fspan>\n  <\u002Ffooter>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;proxyOrigin&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Feeds&quot;},&quot;ringRadiusMiles&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:10,&quot;min&quot;:2,&quot;max&quot;:30,&quot;step&quot;:1,&quot;unit&quot;:&quot;mi&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Feeds&quot;}}\">\nconst DANFORTH = { lat: 38.6488, lon: -90.3108, name: \"Danforth Campus\" };\nconst MEDICAL = { lat: 38.6362, lon: -90.2636, name: \"Medical Campus\" };\nconst TZ = \"America/Chicago\";\n// Managed WashU devices block *.workers.dev at the network layer, so the proxy\n// origin must be replaceable without re-exporting the dashboard: a prop wins,\n// then a value the desk saved locally, then the default workers.dev host.\nconst WORKER_AMEREN_DEFAULT = \"https://washu-em-ameren.washu-em.workers.dev\";\nconst ENDPOINT_STORE = \"wuem-proxy-origin\";\n\n// Returns a normalized absolute origin, or null if the value cannot be one.\nconst normalizeOrigin = raw => {\n  const v = String(raw == null ? \"\" : raw).trim().replace(/\\/+$/, \"\");\n  if (!v) return null;\n  const withScheme = /^https?:\\/\\//i.test(v) ? v : \"https://\" + v;\n  try {\n    const u = new URL(withScheme);\n    if (!/^https?:$/.test(u.protocol) || !u.hostname.includes(\".\")) return null;\n    return u.origin;\n  } catch (e) { return null; }\n};\n\n// NOAA's National Water Prediction Service (the successor to AHPS) is CORS-open,\n// so these are read straight from the browser — no proxy, which means this panel\n// keeps working on managed devices where *.workers.dev is blocked.\n// Ordered upstream-to-downstream where it matters: an upstream gauge is a lead\n// indicator for the one below it.\nconst NWPS_GAUGES = [\n  { id: \"eadm7\", label: \"Mississippi at St. Louis\", note: \"Downtown and Medical Campus exposure\" },\n  { id: \"sclm7\", label: \"Missouri at St. Charles\", note: \"West county commute routes\" },\n  { id: \"arnm7\", label: \"Meramec at Arnold\", note: \"South county commute routes\" },\n  { id: \"pcfm7\", label: \"Meramec near Pacific\", note: \"Upstream of Arnold — lead indicator\" },\n  { id: \"grfi2\", label: \"Mississippi at Grafton\", note: \"Upstream of St. Louis — lead indicator\" },\n  { id: \"alni2\", label: \"Mississippi at Mel Price\", note: \"Alton lock and dam\" }\n];\n\nconst FLOOD_CATEGORY = {\n  no_flooding: { label: \"No flooding\", tone: \"#605d5d\" },\n  low_threshold: { label: \"Below action\", tone: \"#605d5d\" },\n  fcst_not_current: { label: \"No current forecast\", tone: \"#605d5d\" },\n  action: { label: \"Action stage\", tone: \"#b8860b\" },\n  minor: { label: \"Minor flooding\", tone: \"#ec3013\" },\n  moderate: { label: \"Moderate flooding\", tone: \"#ec3013\" },\n  major: { label: \"Major flooding\", tone: \"#ae1800\" }\n};\n\nconst STL_DOMAINS = /(ksdk|stltoday|fox2now|kmov|firstalert4|stlpr|riverfronttimes|stlouis|stlmag|kmox|nbcstl|stltalk)\\./i;\nconst HAZARD_RE = /\\b(tornado|torna|flood|flooding|storm|severe weather|hail|evacuat|outage|power out|fire|wildfire|shoot|shots fired|protest|demonstrat|closure|closed|crash|hazmat|boil (order|advisory)|heat (advisory|warning)|emergency|police|standoff|derail|water main|gas leak|active shooter|lockdown)\\b/i;\nconst NOT_STL_RE = /\\b(duluth|boundary waters|carlton county|hibbing|virginia, mn|minnesota|iron range|ely, mn)\\b/i;\nconst STL_TEXT_RE = /\\b(st\\.? ?louis|saint louis|missouri|\\bmo\\b|clayton|university city|kirkwood|florissant|ferguson|chesterfield|maplewood|webster groves|brentwood|creve coeur|st\\.? charles|jefferson county)\\b/i;\n\nconst round1 = v => Math.round(v * 10) / 10;\nconst tzAbbr = iso => { try { return new Intl.DateTimeFormat(\"en-US\", { timeZone: TZ, timeZoneName: \"short\" }).formatToParts(new Date(iso)).find(p => p.type === \"timeZoneName\").value; } catch (e) { return \"CT\"; } };\nconst fmtTime = iso => { if (!iso) return \"—\"; const d = new Date(iso); if (isNaN(d.getTime())) return \"—\"; try { return d.toLocaleTimeString(\"en-US\", { timeZone: TZ, hour: \"2-digit\", minute: \"2-digit\", hour12: false }); } catch (e) { return \"—\"; } };\nconst fmtZoned = iso => { const t = fmtTime(iso); return t === \"—\" ? t : t + \" \" + tzAbbr(iso); };\nconst isoOffsetMin = iso => { const m = String(iso || \"\").match(/(Z|[+-]\\d{2}:?\\d{2})$/); if (!m) return null; if (m[1] === \"Z\") return 0; const sign = m[1][0] === \"-\" ? -1 : 1; const p = m[1].slice(1).replace(\":\", \"\"); return sign * (parseInt(p.slice(0, 2), 10) * 60 + parseInt(p.slice(2), 10)); };\nconst campusOffsetMin = iso => { try { const d = new Date(iso); return Math.round((new Date(d.toLocaleString(\"en-US\", { timeZone: TZ })) - new Date(d.toLocaleString(\"en-US\", { timeZone: \"UTC\" }))) / 60000); } catch (e) { return null; } };\nconst officeClock = iso => { const off = isoOffsetMin(iso); const d = new Date(iso); if (off === null || isNaN(d)) return null; const sh = new Date(d.getTime() + off * 60000); const sign = off < 0 ? \"-\" : \"+\"; const abs = Math.abs(off); return String(sh.getUTCHours()).padStart(2, \"0\") + \":\" + String(sh.getUTCMinutes()).padStart(2, \"0\") + \" UTC\" + sign + String(Math.floor(abs / 60)).padStart(2, \"0\") + \":\" + String(abs % 60).padStart(2, \"0\"); };\nconst fmtDay = iso => { if (!iso) return \"—\"; const d = new Date(iso); if (isNaN(d.getTime()) || d.getUTCFullYear() < 1900) return \"—\"; try { return d.toLocaleDateString(\"en-US\", { timeZone: TZ, month: \"short\", day: \"numeric\" }) + \" \" + fmtTime(iso); } catch (e) { return \"—\"; } };\nconst c2f = c => c === null || c === undefined ? null : Math.round(c * 9 / 5 + 32);\nconst ms2mph = v => v === null || v === undefined ? null : Math.round(v * 2.23694);\nconst kmh2mph = v => v === null || v === undefined ? null : Math.round(v * 0.621371);\n\nclass Component extends DCLogic {\n  state = { view: \"hazards\", chartMode: \"temp\", loading: true, retrieved: null, alertsD: [], alertsM: [], moAlerts: [], obs: null, hourly: [], gauges: null, gaugeMain: null, air: null, quakes: null, news: null, errors: {} };\n\n  // Resolution order: explicit prop, saved override, default.\n  proxyOrigin() {\n    const fromProp = normalizeOrigin(this.props.proxyOrigin);\n    if (fromProp) return fromProp;\n    try {\n      const saved = normalizeOrigin(localStorage.getItem(ENDPOINT_STORE));\n      if (saved) return saved;\n    } catch (e) {}\n    return WORKER_AMEREN_DEFAULT;\n  }\n\n  // A saved value that cannot be an origin is reported as invalid rather than\n  // silently ignored — otherwise the desk sees the default working and never\n  // learns their entry was rejected.\n  proxyInvalid() {\n    try {\n      const raw = (localStorage.getItem(ENDPOINT_STORE) || \"\").trim();\n      return raw && !normalizeOrigin(raw) ? raw : null;\n    } catch (e) { return null; }\n  }\n\n  saveProxyOrigin(value) {\n    const raw = String(value || \"\").trim();\n    const v = normalizeOrigin(raw);\n    try {\n      if (!raw) localStorage.removeItem(ENDPOINT_STORE);\n      else localStorage.setItem(ENDPOINT_STORE, v || raw);   // keep the bad value visible so the message can name it\n    } catch (e) {}\n    this.lastPowerAt = 0;\n    this.setState({ proxyDraft: v, power: null }, () => this.load());\n  }\n\n  componentDidMount() {\n    this.load();\n    // Background tabs publish their context asynchronously; re-render when they do.\n    this.onCtx = () => this.forceUpdate();\n    window.addEventListener(\"om-context\", this.onCtx);\n  }\n\n  componentWillUnmount() { window.removeEventListener(\"om-context\", this.onCtx); }\n\n  async load() {\n    this.setState({ loading: true, errors: {} });\n    const errors = {};\n    const j = async (key, url, opts) => {\n      try {\n        const r = await fetch(url, opts);\n        if (!r.ok) throw new Error(\"HTTP \" + r.status);\n        return await r.json();\n      } catch (e) { errors[key] = e.message || String(e); return null; }\n    };\n\n    const nws = { headers: { Accept: \"application/ .getUTCHours()) + pad(d.getUTCMinutes()) + \"00\";\n\n    // Files publish on a 15-minute heartbeat at fixed clock minutes, for a few\n    // consecutive minutes each. Sampling by a fixed offset keeps the same phase\n    // mod 15 and can miss every file, so align to the quarter hour and try the\n    // first few minutes of each one, newest first.\n    const quarterStart = Math.floor((Date.now() - 4 * 60000) / (15 * 60000)) * (15 * 60000);\n    const quarters = [];\n    for (let i = 0; i < 96; i++) quarters.push(quarterStart - i * 15 * 60000);\n\n    const tocs = [];\n    const MAX_FILES = 26, BATCH = 3;\n    const tryQuarter = async q => {\n      for (let m = 0; m < 3; m++) {\n        const s = stampAt(new Date(q + m * 60000));\n        try {\n          const r = await fetch(BASE + s + \".toc.json.gz\", { signal: AbortSignal.timeout(10000) });\n          if (!r.ok) continue;\n          return { stamp: s, text: await new Response(r.body.pipeThrough(new DecompressionStream(\"gzip\"))).text() };\n        } catch (e) { /* next minute */ }\n      }\n      return null;\n    };\n    for (let i = 0; i < quarters.length && tocs.length < MAX_FILES; i += BATCH) {\n      const got = await Promise.all(quarters.slice(i, i + BATCH).map(tryQuarter));\n      got.filter(Boolean).forEach(t => tocs.push(t));\n    }\n    if (!tocs.length) return { error: \"No ngrams TOC published in the last 24 hours.\" };\n    tocs.sort((a, b) => b.stamp.localeCompare(a.stamp));\n    const stamp = tocs[0].stamp;\n    const tocText = tocs.map(t => t.text).join(\"\\n\");\n\n    const docs = new Map();\n    const latestIds = new Map(); // DOCIDs are only meaningful within their own minute\n    const stampIso = stamp.slice(0, 4) + \"-\" + stamp.slice(4, 6) + \"-\" + stamp.slice(6, 8) + \"T\" + stamp.slice(8, 10) + \":\" + stamp.slice(10, 12);\n    tocText.split(\"\\n\").forEach(line => {\n      if (!line) return;\n      try {\n        const d = JSON.parse(line);\n        if (d.lang && d.lang !== \"en\") return;\n        if (!d.url || docs.has(d.url)) return;\n        docs.set(d.url, { id: d.ID, title: d.title || \"\", url: d.url, date: d.date, hits: 0, where: [] });\n        if (d.date && d.date.slice(0, 16) === stampIso) latestIds.set(d.ID, d.url);\n      } catch (e) {}\n    });\n\n    const PLACE = /\\b(st\\.? ?louis|saint louis)\\b/i;\n    const MN = /\\b(duluth|boundary waters|carlton county|hibbing|iron range|minnesota|two harbors|virginia mn)\\b/i;\n    const HAZARD = /\\b(tornado|flood|flooding|storm|hail|evacuat\\w*|outage|wildfire|hazmat|lockdown|standoff|derail\\w*|shooting|shooter|protest\\w*|emergency|closure|road closed|water main|gas leak|heat advisory|boil order)\\b/i;\n    const OTHER_WASH = /\\b((eastern|central|western|george) washington university|washington state university|university of washington|washington univ(ersity)? of)\\b/i;\n    const CAMPUS_STRICT = /\\b(washu|wustl|barnes[- ]jewish|siteman|danforth campus|washington university in st\\.? ?louis)\\b/i;\n    const CAMPUS_LOOSE = /\\bwashington university\\b/i;\n    const isCampus = t => CAMPUS_STRICT.test(t) || (CAMPUS_LOOSE.test(t) && !OTHER_WASH.test(t));\n    const NEARBY = /\\b(delmar loop|forest park|central west end|university city|clayton, ?mo|skinker|debaliviere|the loop)\\b/i;\n    const PHRASE = /\\b(tornado (warning|watch|touchdown)|flash flood|shelter in place|state of emergency|boil (order|advisory)|power outage|water main break|active shooter|mass casualty|hazmat (spill|incident)|building collapse|shots fired|evacuation order|heat emergency)\\b/i;\n\n    // Title pass — cheap, always runs.\n    docs.forEach(d => {\n      if (MN.test(d.title)) { d.excluded = true; return; }\n      if (PLACE.test(d.title) && (HAZARD.test(d.title) || PHRASE.test(d.title))) { d.hits += 12; d.where.push(\"hazard headline\"); }\n      else if (isCampus(d.title)) { d.hits += 10; d.where.push(\"campus mention\"); }\n      else if (NEARBY.test(d.title) && (HAZARD.test(d.title) || PHRASE.test(d.title)
