2Fspan>\n              <span style=\"font-family: 'Archivo', system-ui, sans-serif; font-weight: 800; font-size: 24px; line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; color: {{ s.tone }};\">{{ s.value }}<\u002Fspan>\n              <span style=\"font-size: 11px; color: #605d5d;\">{{ s.note }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"position: relative;\">\n        <svg sc-camel-view-box=\"0 0 1000 300\" sc-camel-preserve-aspect-ratio=\"none\" style=\"width: 100%; height: 300px; display: block;\">\n          <sc-for list=\"{{ chart.bands }}\" as=\"b\" hint-placeholder-count=\"4\">\n            <rect x=\"52\" y=\"{{ b.y }}\" width=\"936\" height=\"{{ b.h }}\" fill=\"{{ b.fill }}\"><\u002Frect>\n          <\u002Fsc-for>\n          <sc-for list=\"{{ chart.grid }}\" as=\"g\" hint-placeholder-count=\"5\">\n            <line x1=\"52\" y1=\"{{ g.y }}\" x2=\"988\" y2=\"{{ g.y }}\" stroke=\"#d7d3d3\" stroke-width=\"1\"><\u002Fline>\n          <\u002Fsc-for>\n          <sc-for list=\"{{ chart.night }}\" as=\"n\" hint-placeholder-count=\"2\">\n            <rect x=\"{{ n.x }}\" y=\"18\" width=\"{{ n.w }}\" height=\"{{ n.h }}\" fill=\"rgba(32,30,29,0.05)\"><\u002Frect>\n          <\u002Fsc-for>\n          <sc-for list=\"{{ chart.bars }}\" as=\"b\" hint-placeholder-count=\"24\">\n            <rect x=\"{{ b.x }}\" y=\"{{ b.y }}\" width=\"{{ b.w }}\" height=\"{{ b.h }}\" fill=\"{{ b.fill }}\"><\u002Frect>\n          <\u002Fsc-for>\n          <polyline points=\"{{ chart.secondary }}\" fill=\"none\" stroke=\"{{ chart.stroke2 }}\" stroke-width=\"2.5\" stroke-dasharray=\"7 5\" stroke-linejoin=\"round\"><\u002Fpolyline>\n          <sc-for list=\"{{ chart.dots2 }}\" as=\"d\" hint-placeholder-count=\"24\">\n            <circle cx=\"{{ d.cx }}\" cy=\"{{ d.cy }}\" r=\"2.5\" fill=\"{{ chart.stroke2 }}\"><\u002Fcircle>\n          <\u002Fsc-for>\n          <polygon points=\"{{ chart.area }}\" fill=\"{{ chart.fill }}\"><\u002Fpolygon>\n          <polyline points=\"{{ chart.line }}\" fill=\"none\" stroke=\"{{ chart.stroke }}\" stroke-width=\"3.5\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><\u002Fpolyline>\n          <sc-for list=\"{{ chart.dots }}\" as=\"d\" hint-placeholder-count=\"24\">\n            <rect x=\"{{ d.x }}\" y=\"{{ d.y }}\" width=\"7\" height=\"7\" fill=\"{{ chart.stroke }}\" stroke=\"#f3f2f2\" stroke-width=\"1.5\"><\u002Frect>\n          <\u002Fsc-for>\n          <line x1=\"52\" y1=\"262\" x2=\"988\" y2=\"262\" stroke=\"#201e1d\" stroke-width=\"2\"><\u002Fline>\n          <sc-for list=\"{{ chart.axis }}\" as=\"a\" hint-placeholder-count=\"9\">\n            <line x1=\"{{ a.x }}\" y1=\"262\" x2=\"{{ a.x }}\" y2=\"268\" stroke=\"#201e1d\" stroke-width=\"2\"><\u002Fline>\n          <\u002Fsc-for>\n        <\u002Fsvg>\n        <sc-for list=\"{{ chart.grid }}\" as=\"g\" hint-placeholder-count=\"5\">\n          <span style=\"position: absolute; left: 0; top: {{ g.top }}; transform: translateY(-50%); font-size: 11px; font-weight: 700; color: #605d5d; white-space: nowrap; background: rgba(243,242,242,0.85); padding-right: 3px;\">{{ g.label }}<\u002Fspan>\n        <\u002Fsc-for>\n        <sc-for list=\"{{ chart.dots }}\" as=\"d\" hint-placeholder-count=\"24\">\n          <span style=\"position: absolute; left: {{ d.left }}; top: {{ d.top }}; transform: translate(-50%, -50%); font-size: 12px; font-weight: 800; color: #201e1d; background: rgba(243,242,242,0.85); padding: 0 2px; white-space: nowrap;\">{{ d.label }}<\u002Fspan>\n        <\u002Fsc-for>\n        <sc-for list=\"{{ chart.axis }}\" as=\"a\" hint-placeholder-count=\"9\">\n          <span style=\"position: absolute; left: {{ a.left }}; top: 100%; margin-top: 6px; transform: translateX(-50%); font-size: 11px; font-weight: 700; letter-spacing: 0.06em; color: #605d5d; white-space: nowrap;\">{{ a.label }}<\u002Fspan>\n        <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"display: flex; flex-wrap: wrap; gap: 20px; margin-top: 26px; font-size: 11px; font-weight: 600;\">\n          <span style=\"display: flex; align-items: center; gap: 6px;\"><span style=\"width: 14px; height: 3px; background: {{ chart.stroke }};\"><\u002Fspan>{{ chart.primaryLabel }}<\u002Fspan>\n          <span style=\"display: flex; align-items: center; gap: 6px;\"><span style=\"width: 14px; height: 0; border-top: 2px dashed {{ chart.stroke2 }};\"><\u002Fspan>{{ chart.secondaryLabel }}<\u002Fspan>\n          <span style=\"display: flex; align-items: center; gap: 6px;\"><span style=\"width: 12px; height: 8px; background: #ec3013;\"><\u002Fspan>Probability of precipitation<\u002Fspan>\n          <span style=\"display: flex; align-items: center; gap: 6px;\"><span style=\"width: 12px; height: 8px; background: rgba(32,30,29,0.05); border: 1px solid #d7d3d3;\"><\u002Fspan>Overnight hours<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"padding: 20px 32px; border-bottom: 2px solid rgba(32,30,29,0.4);\">\n        <div style=\"font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #605d5d; margin-bottom: 16px;\">Regional Alert Inventory · NWS CAP, State of Missouri<\u002Fdiv>\n        <sc-raw-table class=\"table\" style=\"width: 100%; font-size: 12px;\">\n          <sc-raw-thead>\n            <sc-raw-tr>\n              <sc-raw-th style=\"text-align: left;\">Event<\u002Fsc-raw-th>\n              <sc-raw-th style=\"text-align: right;\">Active<\u002Fsc-raw-th>\n              <sc-raw-th style=\"text-align: left;\">Highest severity<\u002Fsc-raw-th>\n              <sc-raw-th style=\"text-align: left;\">Campus polygons affected<\u002Fsc-raw-th>\n            <\u002Fsc-raw-tr>\n          <\u002Fsc-raw-thead>\n          <sc-raw-tbody>\n            <sc-for list=\"{{ inventory }}\" as=\"i\">\n              <sc-raw-tr>\n                <sc-raw-td style=\"font-weight: 600;\">{{ i.event }}<\u002Fsc-raw-td>\n                <sc-raw-td style=\"text-align: right; font-variant-numeric: tabular-nums;\">{{ i.count }}<\u002Fsc-raw-td>\n                <sc-raw-td style=\"color: #605d5d;\">{{ i.severity }}<\u002Fsc-raw-td>\n                <sc-raw-td style=\"color: {{ i.tone }}; font-weight: 600;\">{{ i.campus }}<\u002Fsc-raw-td>\n              <\u002Fsc-raw-tr>\n            <\u002Fsc-for>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table>\n        <div style=\"font-size: 11px; color: #605d5d; margin-top: 10px;\">{{ inventoryNote }}<\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"padding: 20px 32px 28px;\">\n        <div style=\"font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #605d5d; margin-bottom: 4px;\">Open-Source News Monitor · GDELT Web NGrams<\u002Fdiv>\n        <div style=\"font-size: 11px; color: #605d5d; margin-bottom: 16px;\">{{ newsSource }}<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column;\">\n          <sc-for list=\"{{ news }}\" as=\"n\" hint-placeholder-count=\"6\">\n            <div style=\"display: grid; grid-template-columns: 1fr 200px; gap: 20px; align-items: baseline; padding: 11px 0; border-bottom: 1px solid #d7d3d3;\">\n              <a href=\"{{ n.url }}\" target=\"_blank\" style=\"font-size: 13px; font-weight: 600; line-height: 1.4;\">{{ n.title }}<\u002Fa>\n              <span style=\"display: flex; flex-direction: column; gap: 2px; text-align: right; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: #605d5d;\">\n                <span>{{ n.meta }}<\u002Fspan>\n                <span style=\"letter-spacing: 0.04em; text-transform: none;\">{{ n.why }}<\u002Fspan>\n              <\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"padding: 20px 32px 28px; border-top: 2px solid rgba(32,30,29,0.4);\">\n        <div style=\"font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #605d5d; margin-bottom: 4px;\">Electric Utility · Ameren Outage Map<\u002Fdiv>\n        <div style=\"font-size: 11px; color: #605d5d; margin-bottom: 18px;\">{{ powerNote }}<\u002Fdiv>\n\n        <sc-if value=\"{{ powerStorm }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display: flex; align-items: baseline; gap: 12px; padding: 10px 14px; margin-bottom: 18px; background: #ec3013; color: #f3f2f2;\">\n            <span style=\"font-size: 10px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase;\">Storm Mode<\u002Fspan>\n            <span style=\"font-size: 12px; font-weight: 600;\">Ameren has switched the public map to storm posture — restoration estimates are suspended or generalised.<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ powerReady }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display: grid; grid-template-columns: repeat(4, 1fr); border-top: 2px solid rgba(32,30,29,0.4); border-bottom: 2px solid rgba(32,30,29,0.4); margin-bottom: 22px;\">\n            <sc-for list=\"{{ powerStats }}\" as=\"p\" hint-placeholder-count=\"4\">\n              <div style=\"display: flex; flex-direction: column; gap: 4px; padding: 14px 18px 14px 0;\">\n                <span style=\"font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #605d5d;\">{{ p.label }}<\u002Fspan>\n                <span style=\"font-family: Archivo, sans-serif; font-size: 30px; font-weight: 700; line-height: 1;\">{{ p.value }}<\u002Fspan>\n                <span style=\"font-size: 11px; color: #605d5d;\">{{ p.note }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 32px;\">\n            <div style=\"display: flex; flex-direction: column; min-width: 0;\">\n              <div style=\"font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #605d5d; padding-bottom: 8px; border-bottom: 2px solid rgba(32,30,29,0.4);\">Nearest outages<\u002Fdiv>\n              <sc-for list=\"{{ powerOutages }}\" as=\"o\" hint-placeholder-count=\"5\">\n                <div style=\"display: flex; flex-direction: column; gap: 4px; padding: 11px 0; border-bottom: 1px solid #d7d3d3;\">\n                  <span style=\"font-size: 13px; font-weight: 700;\">{{ o.headline }}<\u002Fspan>\n                  <span style=\"font-size: 11px; color: #605d5d;\">{{ o.cause }} — {{ o.crew }}<\u002Fspan>\n                  <span style=\"display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase;\">\n                    <span style=\"color: {{ o.etrTone }}; font-weight: 700;\">{{ o.etr }}<\u002Fspan>\n                    <span style=\"color: #605d5d;\">{{ o.duration }}<\u002Fspan>\n                  <\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <div style=\"font-size: 11px; color: #605d5d; padding-top: 12px;\">Causes in ring: {{ powerCauses }}<\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display: flex; flex-direction: column; min-width: 0;\">\n              <div style=\"font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #605d5d; padding-bottom: 8px; border-bottom: 2px solid rgba(32,30,29,0.4);\">Metro counties<\u002Fdiv>\n              <sc-for list=\"{{ powerCounties }}\" as=\"c\" hint-placeholder-count=\"8\">\n                <div style=\"display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: baseline; padding: 9px 0; border-bottom: 1px solid #d7d3d3;\">\n                  <span style=\"display: flex; flex-direction: column; gap: 2px; min-width: 0;\">\n                    <span style=\"font-size: 12px; font-weight: 600;\">{{ c.name }}<\u002Fspan>\n                    <span style=\"font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: #605d5d;\">{{ c.served }}<\u002Fspan>\n                  <\u002Fspan>\n                  <span style=\"display: flex; flex-direction: column; gap: 2px; text-align: right;\">\n                    <span style=\"font-size: 15px; font-weight: 700; color: {{ c.tone }};\">{{ c.out }}<\u002Fspan>\n                    <span style=\"font-size: 10px; color: #605d5d;\">{{ c.pct }}<\u002Fspan>\n                  <\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fsection>\n\n      <section style=\"padding: 20px 32px 28px; border-top: 2px solid rgba(32,30,29,0.4);\">\n        <div style=\"font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #605d5d; margin-bottom: 4px;\">Thematic Classification · GDELT GKG 2.0<\u002Fdiv>\n        <div style=\"font-size: 11px; color: #605d5d; margin-bottom: 18px;\">{{ gkgNote }}<\u002Fdiv>\n\n        <div style=\"display: flex; flex-direction: column; gap: 26px;\">\n          <div style=\"display: flex; flex-direction: column; gap: 9px; min-width: 0;\">\n            <div style=\"font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #605d5d; padding-bottom: 8px; border-bottom: 2px solid rgba(32,30,29,0.4);\">Hazard themes in window<\u002Fdiv>\n            <sc-if value=\"{{ gkgSingleNote }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font-size: 11px; color: #605d5d; padding-bottom: 2px;\">Each theme appears once in this window — counts listed rather than charted.<\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-for list=\"{{ gkgThemes }}\" as=\"t\" hint-placeholder-count=\"6\">\n              <div style=\"display: grid; grid-template-columns: minmax(0, 1fr) 28px; gap: 10px; align-items: center; min-width: 0;\">\n                <div style=\"display: flex; flex-direction: column; gap: 3px; min-width: 0;\">\n                  <span style=\"font-size: 11px; font-weight: 600;\">{{ t.label }}<\u002Fspan>\n                  <sc-if value=\"{{ gkgShowBars }}\" hint-placeholder-val=\"{{ false }}\">\n                    <span style=\"height: 6px; background: #ec3013; width: {{ t.width }};\"><\u002Fspan>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n                <span style=\"font-size: 12px; font-weight: 700; text-align: right;\">{{ t.count }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"display: flex; flex-direction: column; min-width: 0;\">\n            <div style=\"font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #605d5d; padding-bottom: 8px; border-bottom: 2px solid rgba(32,30,29,0.4);\">Geo-tagged coverage · tone scored<\u002Fdiv>\n            <sc-for list=\"{{ gkgRecords }}\" as=\"g\" hint-placeholder-count=\"5\">\n              <div style=\"display: flex; flex-direction: column; gap: 5px; padding: 12px 0; border-bottom: 1px solid #d7d3d3; min-width: 0;\">\n                <a href=\"{{ g.url }}\" target=\"_blank\" style=\"font-size: 13px; font-weight: 600; line-height: 1.4; text-wrap: pretty;\">{{ g.slug }}<\u002Fa>\n                <span style=\"font-size: 11px; color: #605d5d; line-height: 1.45;\">{{ g.themes }}<\u002Fspan>\n                <span style=\"display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: #605d5d;\">\n                  <span>{{ g.source }}<\u002Fspan>\n                  <span style=\"letter-spacing: 0.03em; text-transform: none;\">{{ g.place }}<\u002Fspan>\n                  <span style=\"letter-spacing: 0.03em; text-transform: none; font-weight: 700; color: {{ g.toneColor }};\">{{ g.tone }}<\u002Fspan>\n                <\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <sc-if value=\"{{ gkgEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font-size: 12px; color: #605d5d; padding: 14px 0;\">No hazard-themed coverage geo-tagged to the St. Louis region in this window. Themes are counted only where GDELT's own geocoder placed the article here.<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fmain>\n\n    <aside style=\"border-left: 2px solid rgba(32,30,29,0.4);\">\n      <div style=\"padding: 18px 32px 14px 20px; border-bottom: 2px solid rgba(32,30,29,0.4);\">\n        <div style=\"font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #605d5d; margin-bottom: 4px;\">Feed Registry<\u002Fdiv>\n        <div style=\"font-size: 11px; color: #605d5d;\">{{ registryNote }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <sc-for list=\"{{ registry }}\" as=\"r\" hint-placeholder-count=\"14\">\n          <div style=\"display: grid; grid-template-columns: 10px 1fr auto; gap: 12px; align-items: start; padding: 13px 32px 13px 20px; border-bottom: 1px solid #d7d3d3;\">\n            <span style=\"width: 10px; height: 10px; margin-top: 4px; background: {{ r.dot }};\"><\u002Fspan>\n            <div style=\"display: flex; flex-direction: column; gap: 3px;\">\n              <span style=\"font-size: 13px; font-weight: 700;\">{{ r.name }}<\u002Fspan>\n              <span style=\"font-size: 11px; color: #605d5d; word-break: break-all;\">{{ r.endpoint }}<\u002Fspan>\n              <span style=\"font-size: 11px; color: {{ r.tone }};\">{{ r.detail }}<\u002Fspan>\n            <\u002Fdiv>\n            <span style=\"font-size: 9px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; padding: 3px 6px; background: {{ r.chipBg }}; color: {{ r.chipFg }}; white-space: nowrap;\">{{ r.status }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"padding: 18px 32px 28px 20px;\">\n        <div style=\"font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #605d5d; margin-bottom: 8px;\">To connect the remaining feeds<\u002Fdiv>\n        <p style=\"margin: 0 0 8px; font-size: 12px; line-height: 1.55; color: #444141;\">Social platforms, Ameren outage data, Metro GTFS-RT, MoDOT, scanner audio and campus CAD all either require credentials or block direct browser requests. Each needs a small server-side collector that authenticates, normalizes and re-serves the payload to this page.<\u002Fp>\n        <p style=\"margin: 0; font-size: 12px; line-height: 1.55; color: #444141;\">Until that collector exists those panels stay empty by design — an empty panel is an honest one.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Faside>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"display: {{ weatherDisplay }};\">\n    <div style=\"display: flex; align-items: center; gap: 14px; padding: 10px 32px; background: #201e1d; color: #f3f2f2; border-bottom: 2px solid #201e1d;\">\n      <span style=\"font-size: 10px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; padding: 4px 8px; background: #f3f2f2; color: #201e1d;\">Live NWS Feed<\u002Fspan>\n      <span style=\"font-size: 12px; font-weight: 600;\">National active-alert feed, polled every 30 seconds. A Tornado Warning polygon intersecting the 5-mile ring around Brookings Hall raises a full-screen notification prompt with the Alertus launch link.<\u002Fspan>\n    <\u002Fdiv>\n    <x-import component-from-global-scope=\"weather-monitor\" hint-size=\"100%,900px\"><\u002Fx-import>\n  <\u002Fdiv>\n\n  <div style=\"display: {{ roadsDisplay }};\">\n    <x-import component-from-global-scope=\"road-conditions\" hint-size=\"100%,900px\"><\u002Fx-import>\n  <\u002Fdiv>\n\n  <footer style=\"display: grid; grid-template-columns: 1fr auto; gap: 24px; padding: 16px 32px 28px; border-top: 2px solid rgba(32,30,29,0.4); font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #605d5d;\">\n    <span>Live public data · No credentials stored · Machine-composed summary requires analyst confirmation before release<\u002Fspan>\n    <span>{{ retrievedFull }}<\u002Fspan>\n  <\u002Ffooter>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{}\">\nconst DANFORTH = { lat: 38.6488, lon: -90.3108, name: \"Danforth Campus\" };\nconst MEDICAL = { lat: 38.6362, lon: -90.2636, name: \"Medical Campus\" };\nconst TZ = \"America/Chicago\";\nconst WORKER_AMEREN = \"https://washu-em-ameren.washu-em.workers.dev\";\n\nconst STL_DOMAINS = /(ksdk|stltoday|fox2now|kmov|firstalert4|stlpr|riverfronttimes|stlouis|stlmag|kmox|nbcstl|stltalk)\\./i;\nconst HAZARD_RE = /\\b(tornado|torna|flood|flooding|storm|severe weather|hail|evacuat|outage|power out|fire|wildfire|shoot|shots fired|protest|demonstrat|closure|closed|crash|hazmat|boil (order|advisory)|heat (advisory|warning)|emergency|police|standoff|derail|water main|gas leak|active shooter|lockdown)\\b/i;\nconst NOT_STL_RE = /\\b(duluth|boundary waters|carlton county|hibbing|virginia, mn|minnesota|iron range|ely, mn)\\b/i;\nconst STL_TEXT_RE = /\\b(st\\.? ?louis|saint louis|missouri|\\bmo\\b|clayton|university city|kirkwood|florissant|ferguson|chesterfield|maplewood|webster groves|brentwood|creve coeur|st\\.? charles|jefferson county)\\b/i;\n\nconst tzAbbr = iso => { try { return new Intl.DateTimeFormat(\"en-US\", { timeZone: TZ, timeZoneName: \"short\" }).formatToParts(new Date(iso)).find(p => p.type === \"timeZoneName\").value; } catch (e) { return \"CT\"; } };\nconst fmtTime = iso => { if (!iso) return \"—\"; const d = new Date(iso); if (isNaN(d.getTime())) return \"—\"; try { return d.toLocaleTimeString(\"en-US\", { timeZone: TZ, hour: \"2-digit\", minute: \"2-digit\", hour12: false }); } catch (e) { return \"—\"; } };\nconst fmtZoned = iso => { const t = fmtTime(iso); return t === \"—\" ? t : t + \" \" + tzAbbr(iso); };\nconst isoOffsetMin = iso => { const m = String(iso || \"\").match(/(Z|[+-]\\d{2}:?\\d{2})$/); if (!m) return null; if (m[1] === \"Z\") return 0; const sign = m[1][0] === \"-\" ? -1 : 1; const p = m[1].slice(1).replace(\":\", \"\"); return sign * (parseInt(p.slice(0, 2), 10) * 60 + parseInt(p.slice(2), 10)); };\nconst campusOffsetMin = iso => { try { const d = new Date(iso); return Math.round((new Date(d.toLocaleString(\"en-US\", { timeZone: TZ })) - new Date(d.toLocaleString(\"en-US\", { timeZone: \"UTC\" }))) / 60000); } catch (e) { return null; } };\nconst officeClock = iso => { const off = isoOffsetMin(iso); const d = new Date(iso); if (off === null || isNaN(d)) return null; const sh = new Date(d.getTime() + off * 60000); const sign = off < 0 ? \"-\" : \"+\"; const abs = Math.abs(off); return String(sh.getUTCHours()).padStart(2, \"0\") + \":\" + String(sh.getUTCMinutes()).padStart(2, \"0\") + \" UTC\" + sign + String(Math.floor(abs / 60)).padStart(2, \"0\") + \":\" + String(abs % 60).padStart(2, \"0\"); };\nconst fmtDay = iso => { if (!iso) return \"—\"; const d = new Date(iso); if (isNaN(d.getTime())) return \"—\"; try { return d.toLocaleDateString(\"en-US\", { timeZone: TZ, month: \"short\", day: \"numeric\" }) + \" \" + fmtTime(iso); } catch (e) { return \"—\"; } };\nconst c2f = c => c === null || c === undefined ? null : Math.round(c * 9 / 5 + 32);\nconst ms2mph = v => v === null || v === undefined ? null : Math.round(v * 2.23694);\nconst kmh2mph = v => v === null || v === undefined ? null : Math.round(v * 0.621371);\n\nclass Component extends DCLogic {\n  state = { view: \"hazards\", chartMode: \"temp\", aiInput: \"\", aiOutput: \"\", aiPrompt: \"\", aiBusy: false, aiError: \"\", loading: true, retrieved: null, alertsD: [], alertsM: [], moAlerts: [], obs: null, hourly: [], gauges: null, gaugeMain: null, air: null, quakes: null, news: null, errors: {} };\n\n  componentDidMount() {\n    this.load();\n    // Background tabs publish their context asynchronously; re-render when they do.\n    this.onCtx = () => this.forceUpdate();\n    window.addEventListener(\"om-context\", this.onCtx);\n  }\n\n  componentWillUnmount() { window.removeEventListener(\"om-context\", this.onCtx); }\n\n  async load() {\n    this.setState({ loading: true, errors: {} });\n    const errors = {};\n    const j = async (key, url, opts) => {\n      try {\n        const r = await fetch(url, opts);\n        if (!r.ok) throw new Error(\"HTTP \" + r.status);\n        return await r.json();\n      } catch (e) { errors[key] = e.message || String(e); return null; }\n    };\n\n    const nws = { headers: { Accept: \"application/geo+json\" } };\n    if (!this.lastPowerAt || Date.now() - this.lastPowerAt >= 120000) {\n      this.lastPowerAt = Date.now();\n      this.setState({ powerLoading: true });\n      fetch(WORKER_AMEREN + \"/ameren?radius=10\", { signal: AbortSignal.timeout(25000) })\n        .then(r => r.ok ? r.json() : Promise.reject(new Error(\"HTTP \" + r.status)))\n        .then(power => this.setState({ power, powerLoading: false }))\n        .catch(e => this.setState({ power: { error: e && e.message ? e.message : String(e) }, powerLoading: false }));\n    }\n    const NEWS_MIN_INTERVAL = 900000; // ngrams publish on a 15-minute heartbeat\n    const newsDue = !this.lastNewsAt || Date.now() - this.lastNewsAt >= NEWS_MIN_INTERVAL;\n    if (newsDue) {\n      this.lastNewsAt = Date.now();\n      // Detached: the ngrams scan streams tens of megabytes and must never gate\n      // first paint of the alert band, observations or forecast.\n      this.setState({ newsScanning: true });\n      this.newsScan(this.state.newsDeep !== false)\n        .then(scan => this.setState({ newsScan: scan, newsScanning: false }))\n        .catch(e => this.setState({ newsScan: { error: e && e.message ? e.message : String(e) }, newsScanning: false }));\n      this.setState({ gkgScanning: true });\n      this.gkgScan()\n        .then(gkg => this.setState({ gkg: gkg, gkgScanning: false }))\n        .catch(e => this.setState({ gkg: { error: e && e.message ? e.message : String(e) }, gkgScanning: false }));\n    }\n\n    const [alertsD, alertsM, moAlerts, points, obs, gauges, gaugeMain, air, quakes, news] = await Promise.all([\n      j(\"alertsD\", \"https://api.weather.gov/alerts/active?point=\" + DANFORTH.lat + \",\" + DANFORTH.lon, nws),\n      j(\"alertsM\", \"https://api.weather.gov/alerts/active?point=\" + MEDICAL.lat + \",\" + MEDICAL.lon, nws),\n      j(\"moAlerts\", \"https://api.weather.gov/alerts/active?area=MO\", nws),\n      j(\"points\", \"https://api.weather.gov/points/\" + DANFORTH.lat + \",\" + DANFORTH.lon, nws),\n      j(\"obs\", \"https://api.weather.gov/stations/KSTL/observations/latest\", nws),\n      j(\"gauges\", \"https://waterservices.usgs.gov/nwis/iv/?format=json&countyCd=29189,29510&parameterCd=00065&siteStatus=active\"),\n      j(\"gaugeMain\", \"https://waterservices.usgs.gov/nwis/iv/?format=json&sites=07010000&parameterCd=00065,00060&siteStatus=active\"),\n      j(\"air\", \"https://air-quality-api.open-meteo.com/v1/air-quality?latitude=\" + DANFORTH.lat + \"&longitude=\" + DANFORTH.lon + \"&current=us_aqi,pm2_5,pm10,ozone&timezone=America%2FChicago\"),\n      j(\"quakes\", \"https://earthquake.usgs.gov/fdsnws/event/1/query?format=geojson&starttime=\" + new Date(Date.now() - 30 * 864e5).toISOString().slice(0, 10) + \"&minmagnitude=2.5&minlatitude=34.5&maxlatitude=39.5&minlongitude=-92&maxlongitude=-87.5&orderby=time\"),\n      Promise.resolve(null)\n    ]);\n\n    let hourly = [];\n    if (points && points.properties && points.properties.forecastHourly) {\n      const h = await j(\"hourly\", points.properties.forecastHourly, nws);\n      if (h && h.properties) hourly = h.properties.periods.slice(0, 24);\n    }\n\n    const s0 = this.state;\n    this.setState({ loading: false, retrieved: new Date(), alertsD: (alertsD && alertsD.features) || [], alertsM: (alertsM && alertsM.features) || [], moAlerts: (moAlerts && moAlerts.features) || [], obs: obs && obs.properties, hourly, gauges, gaugeMain, air: air && air.current, quakes: quakes && quakes.features, newsSkipped: !newsDue, errors });\n  }\n\n  campusAlerts() {\n    const map = new Map();\n    this.state.alertsD.forEach(f => map.set(f.id, { f, campuses: [\"Danforth\"] }));\n    this.state.alertsM.forEach(f => {\n      const e = map.get(f.id);\n      if (e) e.campuses.push(\"Medical\");\n      else map.set(f.id, { f, campuses: [\"Medical\"] });\n    });\n    return [...map.values()];\n  }\n\n\n\n\n  // GDELT asked researchers to stop hitting the DOC API and use the minute-level\n  // Web NGrams dataset instead (blog.gdeltproject.org, 30 Jun 2026). Each minute\n  // publishes a quadgram histogram plus a TOC of article ids, titles and URLs.\n  // We scan the TOC titles always, and optionally stream the quadgram file to\n  // catch body mentions, cross-referencing DOCIDs back to the TOC.\n  async newsScan(deep) {\n    const BASE = \"https://storage.googleapis.com/data.gdeltproject.org/gdeltv5/weblegacy/ngrams/\";\n    const pad = n => String(n).padStart(2, \"0\");\n    const stampAt = d => \"\" + d.getUTCFullYear() + pad(d.getUTCMonth() + 1) + pad(d.getUTCDate()) + pad(d.getUTCHours()) + pad(d.getUTCMinutes()) + \"00\";\n\n    // Files publish on a 15-minute heartbeat at fixed clock minutes, for a few\n    // consecutive minutes each. Sampling by a fixed offset keeps the same phase\n    // mod 15 and can miss every file, so align to the quarter hour and try the\n    // first few minutes of each one, newest first.\n    const quarterStart = Math.floor((Date.now() - 4 * 60000) / (15 * 60000)) * (15 * 60000);\n    const quarters = [];\n    for (let i = 0; i < 96; i++) quarters.push(quarterStart - i * 15 * 60000);\n\n    const tocs = [];\n    const MAX_FILES = 26, BATCH = 3;\n    const tryQuarter = async q => {\n      for (let m = 0; m < 3; m++) {\n        const s = stampAt(new Date(q + m * 60000));\n        try {\n          const r = await fetch(BASE + s + \".toc.json.gz\", { signal: AbortSignal.timeout(10000) });\n          if (!r.ok) continue;\n          return { stamp: s, text: await new Response(r.body.pipeThrough(new DecompressionStream(\"gzip\"))).text() };\n        } catch (e) { /* next minute */ }\n      }\n      return null;\n    };\n    for (let i = 0; i < quarters.length && tocs.length < MAX_FILES; i += BATCH) {\n      const got = await Promise.all(quarters.slice(i, i + BATCH).map(tryQuarter));\n      got.filter(Boolean).forEach(t => tocs.push(t));\n    }\n    if (!tocs.length) return { error: \"No ngrams TOC published in the last 24 hours.\" };\n    tocs.sort((a, b) => b.stamp.localeCompare(a.stamp));\n    const stamp = tocs[0].stamp;\n    const tocText = tocs.map(t => t.text).join(\"\\n\");\n\n    const docs = new Map();\n    const latestIds = new Map(); // DOCIDs are only meaningful within their own minute\n    const stampIso = stamp.slice(0, 4) + \"-\" + stamp.slice(4, 6) + \"-\" + stamp.slice(6, 8) + \"T\" + stamp.slice(8, 10) + \":\" + stamp.slice(10, 12);\n    tocText.split(\"\\n\").forEach(line => {\n      if (!line) return;\n      try {\n        const d = JSON.parse(line);\n        if (d.lang && d.lang !== \"en\") return;\n        if (!d.url || docs.has(d.url)) return;\n        docs.set(d.url, { id: d.ID, title: d.title || \"\", url: d.url, date: d.date, hits: 0, where: [] });\n        if (d.date && d.date.slice(0, 16) === stampIso) latestIds.set(d.ID, d.url);\n      } catch (e) {}\n    });\n\n    const PLACE = /\\b(st\\.? ?louis|saint louis)\\b/i;\n    const MN = /\\b(duluth|boundary waters|carlton county|hibbing|iron range|minnesota|two harbors|virginia mn)\\b/i;\n    const HAZARD = /\\b(tornado|flood|flooding|storm|hail|evacuat\\w*|outage|wildfire|hazmat|lockdown|standoff|derail\\w*|shooting|shooter|protest\\w*|emergency|closure|road closed|water main|gas leak|heat advisory|boil order)\\b/i;\n    const OTHER_WASH = /\\b((eastern|central|western|george) washington university|washington state university|university of washington|washington univ(ersity)? of)\\b/i;\n    const CAMPUS_STRICT = /\\b(washu|wustl|barnes[- ]jewish|siteman|danforth campus|washington university in st\\.? ?louis)\\b/i;\n    const CAMPUS_LOOSE = /\\bwashington university\\b/i;\n    const isCampus = t => CAMPUS_STRICT.test(t) || (CAMPUS_LOOSE.test(t) && !OTHER_WASH.test(t));\n    const NEARBY = /\\b(delmar loop|forest park|central west end|university city|clayton, ?mo|skinker|debaliviere|the loop)\\b/i;\n    const PHRASE = /\\b(tornado (warning|watch|touchdown)|flash flood|shelter in place|state of emergency|boil (order|advisory)|power outage|water main break|active shooter|mass casualty|hazmat (spill|incident)|building collapse|shots fired|evacuation order|heat emergency)\\b/i;\n\n    // Title pass — cheap, always runs.\n    docs.forEach(d => {\n      if (MN.test(d.title)) { d.excluded = true; return; }\n      if (PLACE.test(d.title) && (HAZARD.test(d.title) || PHRASE.test(d.title))) { d.hits += 12; d.where.push(\"hazard headline\"); }\n      else if (isCampus(d.title)) { d.hits += 10; d.where.push(\"campus mention\"); }\n      else if (NEARBY.test(d.title) && (HAZARD.test(d.title) || PHRASE.test(d.title))) { d.hits += 7; d.where.push(\"adjacent neighbourhood + hazard\"); }\n    });\n\n    let scannedBytes = 0, partial = false, quadgramHits = 0;\n    if (deep) {\n      try {\n        const r = await fetch(BASE + stamp + \".ngrams.txt.gz\", { signal: AbortSignal.timeout(45000) });\n        if (r.ok) {\n          const reader = r.body.pipeThrough(new DecompressionStream(\"gzip\")).pipeThrough(new TextDecoderStream()).getReader();\n          const strong = new Map();   // place AND hazard inside one quadgram\n          const phrase = new Map();   // unambiguous hazard phrase on its own\n          const placeOnly = new Map();\n          const campus = new Map();\n          const otherWash = new Set(); // Eastern/Central/State etc., seen anywhere in the doc\n          let tail = \"\";\n          const CAP = 45 * 1024 * 1024;\n          while (true) {\n            const { value, done } = await reader.read();\n            if (done) break;\n            scannedBytes += value.length;\n            const lines = (tail + value).split(\"\\n\");\n            tail = lines.pop();\n            for (const line of lines) {\n              const tab1 = line.indexOf(\"\\t\");\n              if (tab1 < 0) continue;\n              const tab2 = line.indexOf(\"\\t\", tab1 + 1);\n              const id = +line.slice(0, tab1);\n              const gram = line.slice(tab1 + 1, tab2 < 0 ? undefined : tab2);\n              const url = latestIds.get(id);\n              if (!url) continue;\n              if (MN.test(gram)) { const d = docs.get(url); if (d) d.excluded = true; continue; }\n              const hasPlace = PLACE.test(gram);\n              if (OTHER_WASH.test(gram)) { otherWash.add(url); campus.delete(url); continue; }\n              if (isCampus(gram)) { if (!otherWash.has(url)) campus.set(url, (campus.get(url) || 0) + 1); continue; }\n              if (NEARBY.test(gram) && HAZARD.test(gram)) { strong.set(url, (strong.get(url) || 0) + 1); continue; }\n              if (hasPlace && HAZARD.test(gram)) { strong.set(url, (strong.get(url) || 0) + 1); continue; }\n              if (PHRASE.test(gram)) { phrase.set(url, (phrase.get(url) || 0) + 1); continue; }\n              if (hasPlace) placeOnly.set(url, (placeOnly.get(url) || 0) + 1);\n            }\n            if (scannedBytes > CAP) { partial = true; await reader.cancel(); break; }\n          }\n          docs.forEach((d, key) => {\n            if (d.excluded) return;\n            const sc = strong.get(key) || 0;\n            const ph = phrase.get(key) || 0;\n            const pl = placeOnly.get(key) || 0;\n            // A document qualifies only on co-occurrence, or on an unambiguous\n            // hazard phrase in an article that also names the place.\n            if (sc) {\n              d.hits += 10 * Math.min(sc, 5);\n              d.where.push(sc + \" co-occurring quadgram\" + (sc === 1 ? \"\" : \"s\"));\n              quadgramHits++;\n            } else if (ph && (pl || PLACE.test(d.title))) {\n              d.hits += 4 * Math.min(ph, 4);\n              d.where.push(ph + \" hazard phrase\" + (ph === 1 ? \"\" : \"s\") + \" + place\");\n              quadgramHits++;\n            } else if (campus.get(key) >= 2 && !otherWash.has(key)) {\n              const cc = campus.get(key);\n              d.hits += 3 * Math.min(cc, 4);\n              d.where.push(cc + \" campus quadgram\" + (cc === 1 ? \"\" : \"s\"));\n              quadgramHits++;\n            }\n          });\n        }\n      } catch (e) { partial = true; }\n    }\n\n    const CUTOFF = Date.now() - 24 * 3600 * 1000;\n    const STORE = \"wuem-news-24h-v3\"; // bumped when matching rules change\n    let retained = {};\n    try { retained = JSON.parse(localStorage.getItem(STORE) || \"{}\"); } catch (e) { retained = {}; }\n    [...docs.values()].filter(d => !d.excluded && d.hits > 0).forEach(d => {\n      const prev = retained[d.url];\n      if (!prev || d.hits > prev.hits) retained[d.url] = { title: d.title, date: d.date, hits: d.hits, where: d.where };\n    });\n    Object.keys(retained).forEach(url => {\n      const t = Date.parse(retained[url].date);\n      if (!isNaN(t) && t < CUTOFF) delete retained[url];\n    });\n    try { localStorage.setItem(STORE, JSON.stringify(retained)); } catch (e) {}\n\n    const articles = Object.entries(retained)\n      .map(([url, v]) => ({ url, title: v.title, date: v.date, hits: v.hits, where: v.where || [] }))\n      .sort((a, b) => (Date.parse(b.date) || 0) - (Date.parse(a.date) || 0) || b.hits - a.hits)\n      .slice(0, 12);\n\n    return {\n      stamp, articles,\n      minutes: tocs.length,\n      window: \"24 h rolling\",\n      retained: Object.keys(retained).length,\n      corpus: docs.size,\n      deep: !!deep,\n      partial,\n      quadgramHits,\n      scannedMB: scannedBytes ? (scannedBytes / 1048576).toFixed(1) : null\n    };\n  }\n\n\n  // GDELT GKG 2.0 — a 15-minute file of themes, tone and geocoded locations per\n  // article. The zips are plain Cloud Storage objects (CORS-open) and are\n  // inflated here with deflate-raw after reading the exact compressed length out\n  // of the zip's central directory; the archive's trailing bytes break a naive\n  // stream. Gives thematic classification the ngrams histogram cannot.\n  gkgThemeLabel(code) {\n    const map = {\n      NATURAL_DISASTER: \"Natural disaster\", MANMADE_DISASTER: \"Man-made disaster\",\n      EVACUATION: \"Evacuation\", DISPLACED: \"Displacement\", POWER_OUTAGE: \"Power outage\",\n      TERROR: \"Terrorism\", ARMEDCONFLICT: \"Armed conflict\", PROTEST: \"Protest\",\n      KILL: \"Fatalities\", WOUND: \"Injuries\", KILL_IMPLIED: \"Fatalities\", DISEASE: \"Disease\", EPIDEMIC: \"Epidemic\",\n      SHORTAGE: \"Shortage\", FIRE: \"Fire\",\n      CRISISLEX_T03_DEAD: \"Fatalities\", CRISISLEX_T01_CAUTION_ADVICE: \"Caution or advice\",\n      CRISISLEX_C07_SAFETY: \"Safety\", CRISISLEX_O01_WEATHER: \"Weather\",\n      CRISISLEX_T11_UPDATESSYMPATHY: \"Updates\", CRISISLEX_C03_WELLBEING_HEALTH: \"Wellbeing\"\n    };\n    if (map[code]) return map[code];\n    if (code === \"MANMADE_DISASTER_IMPLIED\") return \"Man-made disaster (implied)\";\n    if (code === \"NATURAL_DISASTER_IMPLIED\") return \"Natural disaster (implied)\";\n    if (/^KILL/.test(code)) return \"Fatalities\";\n    if (/^WOUND/.test(code)) return \"Injuries\";\n    let c = code.replace(/^CRISISLEX_[A-Z0-9]+_/, \"\").replace(/^TAX_[A-Z]+_/, \"\").replace(/^WB_\\d+_/, \"\").replace(/^EPU_[A-Z]+_/, \"\");\n    c = c.replace(/^NATURAL_DISASTER_/, \"\").replace(/^MANMADE_DISASTER_/, \"\").replace(/^UNGP_/, \"\");\n    return c.replace(/_/g, \" \").toLowerCase().replace(/\\b\\w/g, m => m.toUpperCase());\n  }\n\n  async gkgScan() {\n    const GCS = \"https://storage.googleapis.com/data.gdeltproject.org/gdeltv2/\";\n    let latest = null;\n    try {\n      const lu = await (await fetch(GCS + \"lastupdate.txt\", { signal: AbortSignal.timeout(12000) })).text();\n      latest = (lu.match(/(\\d{14})\\.export\\.CSV\\.zip/) || [])[1];\n    } catch (e) { return { error: \"lastupdate.txt unreachable\" }; }\n    if (!latest) return { error: \"Could not read the current 15-minute stamp.\" };\n\n    // Walk back in 15-minute steps from the published stamp.\n    const stamps = [];\n    const y = +latest.slice(0, 4), mo = +latest.slice(4, 6) - 1, d = +latest.slice(6, 8);\n    const hh = +latest.slice(8, 10), mi = +latest.slice(10, 12);\n    let cur = Date.UTC(y, mo, d, hh, mi, 0);\n    const pad = n => String(n).padStart(2, \"0\");\n    for (let i = 0; i < 4; i++) {\n      const t = new Date(cur - i * 15 * 60000);\n      stamps.push(\"\" + t.getUTCFullYear() + pad(t.getUTCMonth() + 1) + pad(t.getUTCDate()) + pad(t.getUTCHours()) + pad(t.getUTCMinutes()) + \"00\");\n    }\n\n    const unzipFirst = async buf => {\n      const u8 = new Uint8Array(buf), dv = new DataView(buf);\n      let eocd = -1;\n      for (let i = u8.length - 22; i >= 0 && i > u8.length - 66000; i--) if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }\n      if (eocd < 0) throw new Error(\"no central directory\");\n      const cd = dv.getUint32(eocd + 16, true);\n      const compSize = dv.getUint32(cd + 20, true);\n      const lho = dv.getUint32(cd + 42, true);\n      const start = lho + 30 + dv.getUint16(lho + 26, true) + dv.getUint16(lho + 28, true);\n      const body = u8.slice(start, start + compSize);\n      return new Response(new Blob([body]).stream().pipeThrough(new DecompressionStream(\"deflate-raw\"))).text();\n    };\n\n    const PRIMARY_THEME = /^(NATURAL_DISASTER|MANMADE_DISASTER|EVACUATION|DISPLACED|POWER_OUTAGE|TERROR|ARMEDCONFLICT|PROTEST|FIRE|SHORTAGE|EPIDEMIC|CRISISLEX_[A-Z0-9]+_(EVACUATION|SHELTER|INFRASTRUCTURE|UTILITIES|FIRE|FLOOD))/;\n    const HAZARD_THEME = /^(NATURAL_DISASTER|MANMADE_DISASTER|CRISISLEX_[A-Z0-9]+_(DEAD|INJURED|MISSING|DISPLACED|EVACUATION|SHELTER|INFRASTRUCTURE|UTILITIES|WATER|FIRE|FLOOD|CAUTION_ADVICE)|EVACUATION|DISPLACED|POWER_OUTAGE|TERROR|ARMEDCONFLICT|PROTEST|KILL|WOUND|EPIDEMIC|SHORTAGE|FIRE|SECURITY_SERVICES_[A-Z_]*(POLICE|EMERGENCY))/;\n    const CAMPUS = [38.6488, -90.3108];\n    const miles = (a, b, c, d2) => {\n      const R = 3958.8, p = Math.PI / 180;\n      const dLat = (c - a) * p, dLon = (d2 - b) * p;\n      const h = Math.sin(dLat / 2) ** 2 + Math.cos(a * p) * Math.cos(c * p) * Math.sin(dLon / 2) ** 2;\n      return 2 * R * Math.asin(Math.sqrt(h));\n    };\n\n    const records = [];\n    const themeCounts = new Map();\n    let files = 0, rows = 0, mb = 0;\n\n    for (const stamp of stamps) {\n      let text;\n      try {\n        const r = await fetch(GCS + stamp + \".gkg.csv.zip\", { signal: AbortSignal.timeout(30000) });\n        if (!r.ok) continue;\n        text = await unzipFirst(await r.arrayBuffer());\n      } catch (e) { continue; }\n      files++;\n      mb += text.length / 1048576;\n\n      for (const line of text.split(\"\\n\")) {\n        if (!line) continue;\n        rows++;\n        // Cheap pre-filter before splitting 27 fields.\n        if (line.indexOf(\"USMO\") < 0 && line.indexOf(\"USIL\") < 0 && !/st\\.? ?louis|saint louis/i.test(line)) continue;\n        const fl = line.split(\"\\t\");\n        if (fl.length < 16) continue;\n\n        // Locations: type#name#cc#adm1#lat#lon#featureid\n        let best = null;\n        (fl[9] || \"\").split(\";\").forEach(loc => {\n          const p = loc.split(\"#\");\n          if (p.length < 6) return;\n          const lat = parseFloat(p[4]), lon = parseFloat(p[5]);\n          if (isNaN(lat) || isNaN(lon)) return;\n          const dist = miles(CAMPUS[0], CAMPUS[1], lat, lon);\n          const adm1 = p[3] || \"\";\n          if (adm1 === \"USMN\") return; // Saint Louis Park, MN and St. Louis County, MN\n          const inRegion = adm1 === \"USMO\" || adm1 === \"USIL\";\n          const named = inRegion && /st\\.? ?louis|saint louis/i.test(p[1] || \"\");\n          const score = (named ? 0 : 400) + dist;\n          if (!best || score < best.score) best = { name: p[1], adm1: adm1, lat, lon, dist, named, score, inRegion: inRegion };\n        });\n        if (!best) continue;\n        // Keep St. Louis-named places, or anything inside the metro radius.\n        if (best.dist > 90 && !best.named) continue;\n        if (!best.inRegion && best.dist > 90) continue;\n\n        const url = fl[4] || \"\";\n        const rawThemes = (fl[7] || \"\").split(\";\").filter(Boolean);\n        if (!rawThemes.some(t => PRIMARY_THEME.test(t))) continue;\n        const themes = [...new Set(rawThemes.filter(t => HAZARD_THEME.test(t) || PRIMARY_THEME.test(t)))];\n        if (!themes.length) continue;\n        // Obituaries and memorials carry casualty vocabulary but are not incidents.\n        if (/obitu|death.?notice|in.?memoriam|funeral|memorial.?service/i.test(url + \" \" + (fl[3] || \"\"))) continue;\n        [...new Set(themes.map(t => this.gkgThemeLabel(t)))].forEach(lbl => themeCounts.set(lbl, (themeCounts.get(lbl) || 0) + 1));\n\n        let slug = \"\";\n        try {\n          const path = new URL(url).pathname.split(\"/\").filter(Boolean).pop() || \"\";\n          slug = path.replace(/\\.(html?|php|aspx?)$/i, \"\").replace(/[-_]+/g, \" \").replace(/\\b\\w/g, m => m.toUpperCase());\n        } catch (e) {}\n        const tone = parseFloat((fl[15] || \"\").split(\",\")[0]);\n\n        records.push({\n          source: fl[3] || \"\",\n          url,\n          slug: slug.length > 12 ? slug : (fl[3] || \"Article\"),\n          tone: isNaN(tone) ? null : tone,\n          themes: [...new Set(themes.map(t => this.gkgThemeLabel(t)))].slice(0, 6),\n          place: best.name,\n          dist: best.dist,\n          named: best.named,\n          date: fl[1] || stamp\n        });\n      }\n    }\n\n    if (!files) return { error: \"No GKG files could be read.\" };\n\n    // The same wire story appears on many station sites; collapse by headline slug.\n    const bySlug = new Map();\n    records.forEach(r => {\n      const key = (r.slug || r.url).toLowerCase().slice(0, 60);\n      const prev = bySlug.get(key);\n      if (prev) { prev.outlets++; return; }\n      r.outlets = 1;\n      bySlug.set(key, r);\n    });\n    const unique = [...bySlug.values()]\n      .sort((a, b) => (b.named - a.named) || (b.themes.length - a.themes.length) || (a.dist - b.dist))\n      .slice(0, 12);\n\n    const themes = [...themeCounts.entries()]\n      .map(([label, count]) => ({ code: label, label, count }))\n      .sort((a, b) => b.count - a.count)\n      .slice(0, 10);\n\n    return { latest, files, rows, mb: mb.toFixed(1), records: unique, matched: records.length, themes };\n  }\n\n  // Sources the assistant may query on its own. All are CORS-open and keyless.\n  aiCatalog() {\n    return {\n      nws_alerts_area: { label: \"NWS alerts by state\", args: \"state (2-letter)\", build: a => \"https://api.weather.gov/alerts/active?area=\" + encodeURIComponent(a.state || \"MO\") },\n      nws_alerts_point: { label: \"NWS alerts at a point\", args: \"lat, lon\", build: a => \"https://api.weather.gov/alerts/active?point=\" + a.lat + \",\" + a.lon },\n      nws_forecast: { label: \"NWS forecast at a point\", args: \"lat, lon\", build: a => \"https://api.weather.gov/points/\" + a.lat + \",\" + a.lon, follow: \"forecast\" },\n      nws_hourly: { label: \"NWS hourly forecast at a point\", args: \"lat, lon\", build: a => \"https://api.weather.gov/points/\" + a.lat + \",\" + a.lon, follow: \"forecastHourly\" },\n      nws_observation: { label: \"Latest observation at a station\", args: \"station (e.g. KSTL)\", build: a => \"https://api.weather.gov/stations/\" + encodeURIComponent(a.station || \"KSTL\") + \"/observations/latest\" },\n      nwps_gauge: { label: \"NWS river gauge + flood stages\", args: \"gauge id (e.g. eadm7)\", build: a => \"https://api.water.noaa.gov/nwps/v1/gauges/\" + encodeURIComponent(a.gauge || \"eadm7\") },\n      usgs_gauge: { label: \"USGS gauge readings\", args: \"site number\", build: a => \"https://waterservices.usgs.gov/nwis/iv/?format=json&sites=\" + encodeURIComponent(a.site || \"07010000\") + \"&parameterCd=00065,00060&siteStatus=active\" },\n      air_quality: { label: \"Air quality at a point\", args: \"lat, lon\", build: a => \"https://air-quality-api.open-meteo.com/v1/air-quality?latitude=\" + a.lat + \"&longitude=\" + a.lon + \"&current=us_aqi,pm2_5,pm10,ozone&timezone=America%2FChicago\" },\n      open_meteo: { label: \"Model forecast at a point\", args: \"lat, lon\", build: a => \"https://api.open-meteo.com/v1/forecast?latitude=\" + a.lat + \"&longitude=\" + a.lon + \"&current=temperature_2m,precipitation,wind_speed_10m,wind_gusts_10m&hourly=temperature_2m,precipitation_probability,wind_gusts_10m&forecast_days=2&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=America%2FChicago\" },\n      earthquakes: { label: \"USGS earthquakes\", args: \"days, min magnitude\", build: a => \"https://earthquake.usgs.gov/fdsnws/event/1/query?format=geojson&starttime=\" + new Date(Date.now() - (Number(a.days) || 30) * 864e5).toISOString().slice(0, 10) + \"&minmagnitude=\" + (Number(a.minmag) || 2.5) + \"&minlatitude=34.5&maxlatitude=39.5&minlongitude=-92&maxlongitude=-87.5&orderby=time\" },\n      news: { label: \"GDELT news search\", args: \"query terms\", build: a => \"https://api.gdeltproject.org/api/v2/doc/doc?query=\" + encodeURIComponent((a.query || \"St. Louis\") + \" sourcecountry:US\") + \"&mode=artlist&maxrecords=25&format=json&sort=datedesc\" },\n      bluesky: { label: \"Bluesky post search\", args: \"query terms\", build: a => \"https://public.api.bsky.app/xrpc/app.bsky.feed.searchPosts?limit=25&sort=latest&q=\" + encodeURIComponent(a.query || \"St. Louis\") },\n      wikipedia: { label: \"Wikipedia summary\", args: \"article title\", build: a => \"https://en.wikipedia.org/api/rest_v1/page/summary/\" + encodeURIComponent(a.title || \"St. Louis\") }\n    };\n  }\n\n  aiCatalogDoc() {\n    const c = this.aiCatalog();\n    return Object.keys(c).map(k => \"- \" + k + \" — \" + c[k].label + \" (args: \" + c[k].args + \")\").join(\"\\n\");\n  }\n\n  // Ask the model which sources it wants, fetch them, then answer with the results.\n  async aiPlan(question) {\n    const planPrompt = [\n      \"You are planning data retrieval for an emergency-management dashboard.\",\n      \"Available sources:\",\n      this.aiCatalogDoc(),\n      \"\",\n      \"Campus coordinates: Danforth 38.6488,-90.3108 and Medical 38.6362,-90.2636. Local station KSTL. Mississippi at St. Louis: USGS site 07010000, NWPS gauge eadm7.\",\n      \"\",\n      \"QUESTION: \" + question,\n      \"\",\n      \"Reply with ONLY a JSON array, max 4 items, each an object with keys source, args, why (why under 8 words).\",\n      \"Return an empty array if the dashboard data already suffices. No prose, no code fences.\"\n    ].join(\"\\n\");\n    try {\n      const raw = await window.claude.complete(planPrompt);\n      const match = String(raw).match(/\\[[\\s\\S]*\\]/);\n      if (!match) return [];\n      const plan = JSON.parse(match[0]);\n      return Array.isArray(plan) ? plan.slice(0, 4) : [];\n    } catch (e) { return []; }\n  }\n\n  async aiFetchPlan(plan) {\n    const catalog = this.aiCatalog();\n    const results = [];\n    for (const step of plan) {\n      const entry = catalog[step.source];\n      if (!entry) continue;\n      const args = step.args || {};\n      try {\n        const url = entry.build(args);\n        let data = await (await fetch(url, { signal: AbortSignal.timeout(15000), headers: { Accept: \"application/geo+json\" } })).json();\n        if (entry.follow && data && data.properties && data.properties[entry.follow]) {\n          data = await (await fetch(data.properties[entry.follow], { signal: AbortSignal.timeout(15000), headers: { Accept: \"application/geo+json\" } })).  [\"Assess campus exposure\", \"Assess exposure for both campuses over the next 12 hours given the forecast and any active alerts. Name the specific conditions that would change posture.\"],\n      [\"Draft an alert message\", \"Draft a WashU Alert message under 300 characters for the most significant current hazard. If no hazard justifies a mass notification, say so and explain the threshold that is not met.\"],\n      [\"What should we verify?\", \"List what a watch officer should verify next, in priority order, and name the feed or contact for each. Note which items are unverifiable with the feeds currently connected.\"]\n    ];\n    const aiPresets = AI_PRESETS.map(([label, prompt]) => ({ label, run: () => this.aiRun(prompt) }));\n    const aiBridge = typeof window !== \"undefined\" && window.claude && typeof window.claude.complete === \"function\";\n    const omc = (typeof window !== \"undefined\" && window.__omContext) || {};\n    const aiTabsReady = (omc.weather ? 1 : 0) + (omc.roads ? 1 : 0);\n\n    const views = [[\"hazards\", \"All-Hazards Picture\"], [\"weather\", \"Weather Monitoring\"], [\"roads\", \"Road Conditions\"]].map(([k, label]) => ({\n      label,\n      bg: (s.view || \"hazards\") === k ? \"#201e1d\" : \"transparent\",\n      fg: (s.view || \"hazards\") === k ? \"#f3f2f2\" : \"#201e1d\",\n      pick: () => this.setState({ view: k })\n    }));\n\n    return {\n      aiPresets,\n      aiInput: s.aiInput,\n      aiOnInput: e => this.setState({ aiInput: e.target.value }),\n      aiAsk: () => { const q = (this.state.aiInput || \"\").trim(); if (q) this.aiRun(q); },\n      aiButtonLabel: s.aiBusy ? \"Working…\" : \"Ask\",\n      aiSources: s.aiSources || [],\n      aiHasSources: !!(s.aiSources && s.aiSources.length),\n      aiStatus: s.aiBusy ? (s.aiStage || \"Drafting…\") : s.aiError ? \"Unavailable\" : aiBridge ? (aiTabsReady === 2 ? \"Ready · all three tabs reporting\" : aiTabsReady === 1 ? \"Ready · one background tab still reporting\" : \"Ready · background tabs still reporting\")  : \"Bridge not present in this deployment\",\n      aiStatusTone: s.aiError || !aiBridge ? \"#ae1800\" : \"#605d5d\",\n      aiHasOutput: !!(s.aiOutput || s.aiError || s.aiBusy),\n      aiPromptEcho: s.aiPrompt ? \"Task: \" + s.aiPrompt : \"\",\n      aiOutput: s.aiBusy ? (s.aiStage || \"Working…\") : (s.aiError || s.aiOutput),\n      aiBlocks: s.aiBusy || s.aiError ? [] : this.aiBlocks(s.aiOutput),\n      aiShowBlocks: !!(s.aiOutput && !s.aiBusy && !s.aiError),\n      aiShowPlain: !!(s.aiBusy || s.aiError),\n      aiStamp: s.aiAt ? \"Drafted \" + s.aiAt.toLocaleString(\"en-US\", { timeZone: TZ, month: \"short\", day: \"numeric\", hour: \"2-digit\", minute: \"2-digit\", hour12: false }) + \" CT\" : \"\",\n      aiBasis: connected + \" of \" + registry.length + \" feeds connected at draft time\",\n      aiCopyLabel: s.aiCopyState === \"ok\" ? \"Copied\" : s.aiCopyState === \"fail\" ? \"Copy failed\" : \"Copy text\",\n      aiCopy: () => {\n        const text = s.aiOutput || \"\";\n        const fallback = () => {\n          try {\n            const ta = document.createElement(\"textarea\");\n            ta.value = text;\n            ta.style.position = \"fixed\";\n            ta.style.opacity = \"0\";\n            document.body.appendChild(ta);\n            ta.select();\n            const ok = document.execCommand(\"copy\");\n            document.body.removeChild(ta);\n            this.setState({ aiCopyState: ok ? \"ok\" : \"fail\" });\n          } catch (e) { this.setState({ aiCopyState: \"fail\" }); }\n        };\n        if (navigator.clipboard && navigator.clipboard.writeText) {\n          navigator.clipboard.writeText(text)\n            .then(() => this.setState({ aiCopyState: \"ok\" }))\n            .catch(fallback);\n        } else fallback();\n        setTimeout(() => this.setState({ aiCopyState: null }), 2500);\n      },\n      views,\n      isHazards: (s.view || \"hazards\") === \"hazards\",\n      isWeather: s.view === \"weather\",\n      weatherDisplay: s.view === \"weather\" ? \"block\" : \"none\",\n      roadsDisplay: s.view === \"roads\" ? \"block\" : \"none\",\n      isRoads: s.view === \"roads\",\n      pageTitle: s.view === \"weather\" ? \"Weather Monitoring\" : s.view === \"roads\" ? \"Road Conditions & Traffic Cameras\" : \"All-Hazards Common Operating Picture\",\n      retrieved,\n      retrievedFull: s.retrieved ? \"Retrieved \" + s.retrieved.toLocaleString(\"en-US\", { timeZone: TZ }) + \" CT\" : \"\",\n      liveDot: s.loading ? \"#9b9797\" : \"#ec3013\",\n      liveLabel: s.loading ? \"Fetching\" : \"Snapshot at \" + retrieved,\n      refresh: () => this.load(),\n      alertBandBg: bandRed ? \"#ec3013\" : \"#eae9e9\",\n      alertBandFg: bandRed ? \"#f3f2f2\" : \"#201e1d\",\n      alertBandRule: bandRed ? \"rgba(243,242,242,0.5)\" : \"rgba(32,30,29,0.4)\",\n      alertHeadCount, alertHeadLine, hasAlerts, alerts, kpis,\n      obsStation: err.obs ? \"KSTL — unreachable\" : \"KSTL Lambert Field ASOS · observed \" + fmtZoned(o.timestamp),\n      observation, gauges, air, quakes,\n      summary,\n      summaryBasis: connected + \" of \" + registry.length + \" feeds connected\",\n      summaryAlerts: hasAlerts ? alerts.map(x => x.event + \" — \" + (x.headline || x.area)).join(\" · \") : \"No campus-covering NWS product at retrieval time. Statewide count: \" + s.moAlerts.length + \".\",\n      summaryEnv: envBits.length ? envBits.join(\" \") : \"Environmental feeds returned no values.\",\n      summaryGaps: \"No social, utility-outage, transit, roadway or campus-CAD data is present in this snapshot — those feeds are not connected, so this picture is weather, water, air, seismic and news only.\",\n      hourlySource: err.hourly || err.points ? \"Unavailable\" : \"api.weather.gov\",\n      hourlyRange: s.hourly.length ? \"Periods \" + fmtTime(s.hourly[0].startTime) + \" to \" + fmtTime(s.hourly[s.hourly.length - 1].startTime) + \" \" + tzAbbr(s.hourly[0].startTime) + \" · \" + s.hourly.length + \" hours\" : \"No hourly periods returned\",\n      hourlyCols: String(Math.max(1, s.hourly.length)),\n      chart, chartModes, hourlyStats,\n      tempRange: temps.length ? tmin + \"–\" + tmax + \"°F\" : \"—\",\n      inventory,\n      inventoryNote: err.moAlerts ? \"Statewide query failed: \" + err.moAlerts : \"Grouped from \" + s.moAlerts.length + \" active CAP products for area=MO. Campus column tests the same alert IDs against both campus point queries.\",\n      newsSource: newsConnected\n        ? \"GDELT Web NGrams · rolling 24 h to \" + scan.stamp + \" · \" + (scan.minutes || 1) + \" minute files swept, \" + (scan.corpus || 0) + \" English articles\" + (scan.retained ? \", \" + scan.retained + \" retained in window\" : \"\")\n          + (scan.deep ? \", quadgram body scan\" + (scan.scannedMB ? \" of \" + scan.scannedMB + \" MB\" : \"\") + (scan.partial ? \" (capped)\" : \"\") : \", headline scan only\")\n          + \" · \" + newsRelevant.length + \" relevant: hazard co-occurrence or campus mention (Minnesota's St. Louis County excluded)\"\n        : \"GDELT Web NGrams · \" + (s.newsScanning ? \"scanning minute files…\" : (scan.error || \"not yet scanned\")),\n      news, registry,\n      powerNote, powerStats, powerOutages, powerCounties, powerCauses, powerReady, powerStorm,\n      gkgNote, gkgThemes, gkgRecords, gkgEmpty, gkgShowBars, gkgSingleNote,\n      registryNote: connected + \" live · \" + (registry.length - connected) + \" require credentials or a proxy\"\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
