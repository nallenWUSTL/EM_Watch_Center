document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f3f2f2;\n  --color-surface: #eae9e9;\n  --color-text: #201e1d;\n  --color-accent: #ec3013;\n  --color-accent-2: #e15b47;\n  --color-divider: color-mix(in srgb, #201e1d 40%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f8f4f4;\n  --color-neutral-200: #eae7e7;\n  --color-neutral-300: #d7d3d3;\n  --color-neutral-400: #bab6b6;\n  --color-neutral-500: #9b9797;\n  --color-neutral-600: #7d7979;\n  --color-neutral-700: #605d5d;\n  --color-neutral-800: #444141;\n  --color-neutral-900: #2d2b2b;\n\n  --color-accent-100: #fff2ef;\n  --color-accent-200: #ffe0d9;\n  --color-accent-300: #ffc4b8;\n  --color-accent-400: #ff9783;\n  --color-accent-500: #ff563c;\n  --color-accent-600: #dd2b0f;\n  --color-accent-700: #ae1800;\n  --color-accent-800: #7c1405;\n  --color-accent-900: #4d170e;\n\n  --color-accent-2-100: #fff2ef;\n  --color-accent-2-200: #ffe0da;\n  --color-accent-2-300: #ffc4b9;\n  --color-accent-2-400: #ff9784;\n  --color-accent-2-500: #ef6853;\n  --color-accent-2-600: #c94b39;\n  --color-accent-2-700: #9e3526;\n  --color-accent-2-800: #71261b;\n  --color-accent-2-900: #471d16;\n\n  --font-heading: \"Archivo\", system-ui, sans-serif;\n  --font-heading-weight: 800;\n  --font-body: \"Archivo\", system-ui, sans-serif;\n\n  --space-1: 4.0px;\n  --space-2: 8.0px;\n  --space-3: 12.0px;\n  --space-4: 16.0px;\n  --space-6: 24.0px;\n  --space-8: 32.0px;\n\n  --radius-sm: 0px;\n  --radius-md: 0px;\n  --radius-lg: 0px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2d2b2b 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2d2b2b 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.grayscale{filter:grayscale(1) contrast(1.08)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 2px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); justify-content: flex-start; text-align: left; }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: 2px solid var(--color-divider);\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 2px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid var(--color-divider);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg); i, sans-serif; }\n  .leaflet-control-layers { border-radius: 0 !important; border: 2px solid rgba(32,30,29,0.4) !important; background: #f3f2f2 !important; padding: 10px !important; font-size: 11px !important; font-weight: 700 !important; letter-spacing: 0.06em !important; text-transform: uppercase !important; }\n  .leaflet-control-layers-overlays label { margin-bottom: 5px; cursor: pointer; }\n  .leaflet-bar a, .leaflet-tooltip, .leaflet-popup-content-wrapper { border-radius: 0 !important; }\n  .leaflet-tooltip { border: 2px solid #201e1d !important; font-weight: 700 !important; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-width: 1280px; background: #f3f2f2; color: #201e1d; font-family: 'Archivo', system-ui, sans-serif; font-size: 13px; line-height: 1.45;\">\n\n  <header style=\"display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 24px; padding: 20px 32px 14px; border-bottom: 2px solid rgba(32,30,29,0.4);\">\n    <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n      <div style=\"display: flex; align-items: center; gap: 12px; font-size: 10px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #605d5d;\">\n        <span>Washington University in St. Louis<\u002Fspan>\n        <span style=\"width: 24px; height: 2px; background: rgba(32,30,29,0.4);\"><\u002Fspan>\n        <span>Emergency Management · EOC Watch Desk<\u002Fspan>\n      <\u002Fdiv>\n      <h1 style=\"margin: 0; font-family: 'Archivo', system-ui, sans-serif; font-weight: 800; font-size: 30px; letter-spacing: -0.02em; line-height: 1.05;\">{{ pageTitle }}<\u002Fh1>\n    <\u002Fdiv>\n    <sc-if value=\"{{ isHazards }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"display: flex; align-items: center; gap: 20px;\">\n      <div style=\"display: flex; flex-direction: column; gap: 3px; text-align: right;\">\n        <span style=\"font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #605d5d;\">Data ected<\u002Fstrong> require an API key or a server-side proxy and show no data rather than placeholder data.<\u002Fspan>\n  <\u002Fdiv>\n\n  <div style=\"border-bottom: 2px solid rgba(32,30,29,0.4); background: {{ alertBandBg }}; color: {{ alertBandFg }};\">\n    <div style=\"display: flex; align-items: stretch;\">\n      <div style=\"display: flex; align-items: center; padding: 12px 20px 12px 32px; font-size: 11px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; border-right: 2px solid {{ alertBandRule }}; white-space: nowrap;\">{{ alertHeadCount }}<\u002Fdiv>\n      <div style=\"display: flex; align-items: center; padding: 12px 32px; font-size: 14px; font-weight: 700;\">{{ alertHeadLine }}<\u002Fdiv>\n    <\u002Fdiv>\n    <sc-if value=\"{{ hasAlerts }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"border-top: 2px solid {{ alertBandRule }};\">\n        <sc-for list=\"{{ alerts }}\" as=\"a\" hint-placeholder-count=\"2\">\n          <div style=\"display: grid; grid-template-columns: 190px 1fr 240px; gap: 20px; padding: 12px 32px; border-bottom: 1px solid {{ alertBandRule }};\">\n            <div style=\"display: flex; flex-direction: column; gap: 3px;\">\n              <span style=\"font-size: 10px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase;\">{{ a.severity }} · {{ a.urgency }}<\u002Fspan>\n              <span style=\"font-size: 11px; opacity: 0.85;\">{{ a.sender }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 4px;\">\n              <span style=\"font-size: 15px; font-weight: 700;\">{{ a.event }}<\u002Fspan>\n              <span style=\"font-size: 12px; opacity: 0.9;\">{{ a.headline }}<\u002Fspan>\n              <span style=\"font-size: 11px; opacity: 0.8;\">{{ a.area }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 3px; font-size: 11px; font-variant-numeric: tabular-nums;\">\n \n              <span style=\"font-size: 12px; font-weight: 600;\">{{ o.name }}<\u002Fspan>\n              <span style=\"font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; color: {{ o.tone }};\">{{ o.value }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"padding: 20px 20px 20px 32px; border-bottom: 2px solid rgba(32,30,29,0.4);\">\n        <div style=\"font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #605d5d; margin-bottom: 4px;\">River &amp; Stream Gauges<\u002Fdiv>\n        <div style=\"font-size: 11px; color: #605d5d; margin-bottom: 14px;\">USGS NWIS instantaneous values · Mississippi mainstem first, then nearest county sites by distance to campus<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column;\">\n          <sc-for list=\"{{ gauges }}\" as=\"g\" hint-placeholder-count=\"4\">\n            <div style=\"display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 10px; padding: 9px 0; border-bottom: 1px solid #d7d3d3;\">\n              <div style=\"display: flex; flex-direction: column; gap: 2px;\">\n                <span style=\"font-size: 12px; font-weight: 600;\">{{ g.name }}<\u002Fspan>\n                <span style=\"font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: #605d5d;\">{{ g.site }} · {{ g.time }}<\u002Fspan>\n              <\u002Fdiv>\n              <span style=\"font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums;\">{{ g.value }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"padding: 20px 20px 20px 32px; border-bottom: 2px solid rgba(32,30,29,0.4);\">\n        <div style=\"font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #605d5d; margin-bottom: 4px;\">Air Quality<\u002Fdiv>\n        <div style=\"font-size: 11px; color: #605d5d; margin-bottom: 14px;\">Open-Meteo air-quality (CAMS) · campus coordinates<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column;\">\n          <sc-for list=\"{{ air }}\" as=\"a\" hint-placeholder-count=\"4\">\n            <div style=\"display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 10px; padding: 9px 0; border-bottom: 1px solid #d7d3d3;\">\n              <span style=\"font-size: 12px; font-weight: 600;\">{{ a.name }}<\u002Fspan>\n              <span style=\"font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; color: {{ a.tone }};\">{{ a.value }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"padding: 20px 20px 28px 32px;\">\n        <div style=\"font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #605d5d; margin-bottom: 4px;\">Seismic · New Madrid &amp; Wabash Valley<\u002Fdiv>\n        <div style=\"font-size: 11px; color: #605d5d; margin-bottom: 14px;\">USGS FDSN event service · last 30 days, M2.5+<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column;\">\n          <sc-for list=\"{{ quakes }}\" as=\"q\" hint-placeholder-count=\"3\">\n            <div style=\"display: grid; grid-template-columns: 46px 1fr; gap: 10px; padding: 9px 0; border-bottom: 1px solid #d7d3d3;\">\n              <span style=\"font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums;\">{{ q.mag }}<\u002Fspan>\n              <div style=\"display: flex; flex-direction: column; gap: 2px;\">\n                <span style=\"font-size: 12px; font-weight: 600;\">{{ q.place }}<\u002Fspan>\n                <span style=\"font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: #605d5d;\">{{ q.time }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Faside>\n\n    <main>\n ;\">{{ summaryGaps }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"padding: 20px 32px; border-bottom: 2px solid rgba(32,30,29,0.4);\">\n        <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 6px;\">\n          <div style=\"font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #605d5d;\">Next 24 Hours · NWS Hourly Forecast, Danforth Campus Grid Point<\u002Fdiv>\n          <div style=\"font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #605d5d;\">{{ hourlySource }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size: 11px; color: #605d5d; margin-bottom: 16px;\">{{ hourlyRange }}<\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: repeat({{ hourlyCols }}, 1fr); gap: 2px; height: 150px; align-items: end; border-bottom: 2px solid rgba(32,30,29,0.4);\">\n          <sc-for list=\"{{ hourly }}\" as=\"h\" hint-placeholder-count=\"24\">\n            <div style=\"display: flex; flex-direction: column; justify-content: flex-end; height: 100%; position: relative;\">\n              <span style=\"position: absolute; left: 0; right: 0; bottom: {{ h.tempPos }}; height: 2px; background: #201e1d;\"><\u002Fspan>\n              <span style=\"height: {{ h.pop }}; background: #ec3013;\"><\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display: flex; justify-content: space-between; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: #605d5d; margin-top: 6px;\">\n          <sc-for list=\"{{ hourlyTicks }}\" as=\"t\" hint-placeholder-count=\"5\">\n            <span>{{ t.label }}<\u002Fspan>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display: flex; gap: 18px; margin-top: 12px; font-size: 11px; font-weight: 600;\">\n          <span style=\"display: flex; align-items: center; gap: 6px;\"><span style=\"width: 12px; height: 2px; background: #201e1d;\"><\u002Fspan>Temperature {{ tempRange }}<\u002Fspan>\n          <span style=\"display: flex; align-items: center; gap: 6px;\"><span style=\"width: 12px; height: 8px; background: #ec3013;\"><\u002Fspan>Probability of precipitation (0–100%)<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"padding: 20px 32px; border-bottom: 2px solid rgba(32,30,29,0.4);\">\n        <div style=\"font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #605d5d; margin-bottom: 16px;\">Regional Alert Inventory · NWS CAP, State of Missouri<\u002Fdiv>\n        <sc-raw-table class=\"table\" style=\"width: 100%; font-size: 12px;\">\n          <sc-raw-thead>\n            <sc-raw-tr>\n              <sc-raw-th style=\"text-align: left;\">Event<\u002Fsc-raw-th>\n              <sc-raw-th style=\"text-align: right;\">Active<\u002Fsc-raw-th>\n              <sc-raw-th style=\"text-align: left;\">Highest severity<\u002Fsc-raw-th>\n              <sc-raw-th style=\"text-align: left;\">Campus polygons affected<\u002Fsc-raw-th>\n            <\u002Fsc-raw-tr>\n          <\u002Fsc-raw-thead>\n          <sc-raw-tbody>\n            <sc-for list=\"{{ inventory }}\" as=\"i\">\n              <sc-raw-tr>\n                <sc-raw-td style=\"font-weight: 600;\">{{ i.event }}<\u002Fsc-raw-td>\n                <sc-raw-td style=\"text-align: right; font-variant-numeric: tabular-nums;\">{{ i.count }}<\u002Fsc-raw-td>\n                <sc-raw-td style=\"color: #605d5d;\">{{ i.severity }}<\u002Fsc-raw-td>\n                <sc-raw-td style=\"color: {{ i.tone }}; font-weight: 600;\">{{ i.campus }}<\u002Fsc-raw-td>\n              <\u002Fsc-raw-tr>\n            <\u002Fsc-for>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table>\n        <div style=\"font-size: 11px; color: #605d5d; margin-top: 10px;\">{{ inventoryNote }}<\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"padding: 20px 32px 28px;\">\n        <div style=\"font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #605d5d; margin-bottom: 4px;\">Open-Source News Monitor<\u002Fdiv>\n        <div style=\"font-size: 11px; color: #605d5d; margin-bottom: 16px;\">{{ newsSource }}<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column;\">\n          <sc-for list=\"{{ news }}\" as=\"n\" hint-placeholder-count=\"6\">\n            <div style=\"display: grid; grid-template-columns: 1fr 200px; gap: 20px; align-items: baseline; padding: 11px 0; border-bottom: 1px solid #d7d3d3;\">\n              <a href=\"{{ n.url }}\" target=\"_blank\" style=\"font-size: 13px; font-weight: 600; line-height: 1.4;\">{{ n.title }}<\u002Fa>\n              <span style=\"font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: #605d5d;\">{{ n.domain }} · {{ n.time }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fmain>\n\n    <aside style=\"border-left: 2px solid rgba(32,30,29,0.4);\">\n      <div style=\"padding: 18px 32px 14px 20px; border-bottom: 2px solid rgba(32,30,29,0.4);\">\n        <div style=\"font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #605d5d; margin-bottom: 4px;\">Feed Registry<\u002Fdiv>\n        <div style=\"font-size: 11px; color: #605d5d;\">{{ registryNote }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <sc-for list=\"{{ registry }}\" as=\"r\" hint-placeholder-count=\"14\">\n          <div style=\"display: grid; grid-template-columns: 10px 1fr auto; gap: 12px; align-items: start; padding: 13px 32px 13px 20px; border-bottom: 1px solid #d7d3d3;\">\n            <span style=\"width: 10px; height: 10px; margin-top: 4px; background: {{ r.dot }};\"><\u002Fspan>\n            <div style=\"display: flex; flex-direction: column; gap: 3px;\">\n              <span style=\"font-size: 13px; font-weight: 700;\">{{ r.name }}<\u002Fspan>\n              <span style=\"font-size: 11px; color: #605d5d; word-break: break-all;\">{{ r.endpoint }}<\u002Fspan>\n              <span style=\"font-size: 11px; color: {{ r.tone }};\">{{ r.detail }}<\u002Fspan>\n            <\u002Fdiv>\n            <span style=\"font-size: 9px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; padding: 3px 6px; background: {{ r.chipBg }}; color: {{ r.chipFg }}; white-space: nowrap;\">{{ r.status }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"padding: 18px 32px 28px 20px;\">\n        <div style=\"font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #605d5d; margin-bottom: 8px;\">To connect the remaining feeds<\u002Fdiv>\n        <p style=\"margin: 0 0 8px; font-size: 12px; line-height: 1.55; color: #444141;\">Social platforms, Ameren outage data, Metro GTFS-RT, MoDOT, scanner audio and campus CAD all either require credentials or block direct browser requests. Each needs a small server-side collector that authenticates, normalizes and re-serves the payload to this page.<\u002Fp>\n        <p style=\"margin: 0; font-size: 12px; line-height: 1.55; color: #444141;\">Until that collector exists those panels stay empty by design — an empty panel is an honest one.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Faside>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isWeather }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"display: flex; align-items: center; gap: 14px; padding: 10px 32px; background: #201e1d; color: #f3f2f2; border-bottom: 2px solid #201e1d;\">\n      <span style=\"font-size: 10px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; padding: 4px 8px; background: #f3f2f2; color: #201e1d;\">Live NWS Feed<\u002Fspan>\n      <span style=\"font-size: 12px; font-weight: 600;\">National active-alert feed, polled every 30 seconds. A Tornado Warning polygon intersecting the 5-mile ring around Brookings Hall raises a full-screen notification prompt with the Alertus launch link.<\u002Fspan>\n    <\u002Fdiv>\n    <x-import component-from-global-scope=\"weather-monitor\" hint-size=\"100%,900px\"><\u002Fx-import>\n  <\u002Fsc-if>\n\n  <footer style=\"display: grid; grid-template-columns: 1fr auto; gap: 24px; padding: 16px 32px 28px; border-top: 2px solid rgba(32,30,29,0.4); font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #605d5d;\">\n    <span>Live public data · No credentials stored · Machine-composed summary requires analyst confirmation before release<\u002Fspan>\n    <span>{{ retrievedFull }}<\u002Fspan>\n  <\u002Ffooter>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{}\">\nconst DANFORTH = { lat: 38.6488, lon: -90.3108, name: \"Danforth Campus\" };\nconst MEDICAL = { lat: 38.6362, lon: -90.2636, name: \"Medical Campus\" };\nconst TZ = \"America/Chicago\";\n\nconst fmtTime = iso => { try { return new Date(iso).toLocaleTimeString(\"en-US\", { timeZone: TZ, hour: \"2-digit\", minute: \"2-digit\", hour12: false }); } catch (e) { return \"—\"; } };\nconst fmtDay = iso => { try { return new Date(iso).toLocaleDateString(\"en-US\", { timeZone: TZ, month: \"short\", day: \"numeric\" }) + \" \" + fmtTime(iso); } catch (e) { return \"—\"; } };\nconst c2f = c => c === null || c === undefined ? null : Math.round(c * 9 / 5 + 32);\nconst ms2mph = v => v === null || v === undefined ? null : Math.round(v * 2.23694);\nconst kmh2mph = v => v === null || v === undefined ? null : Math.round(v * 0.621371);\n\nclass Component extends DCLogic {\n  state = { view: \"hazards\", loading: true, retrieved: null, alertsD: [], alertsM: [], moAlerts: [], obs: null, hourly: [], gauges: null, gaugeMain: null, air: null, quakes: null, news: null, errors: {} };\n\n  componentDidMount() { this.load(); }\n\n  async load() {\n    this.setState({ loading: true, errors: {} });\n    const errors = {};\n    const j = async (key, url, opts) => {\n      try {\n        const r = await fetch(url, opts);\n        if (!r.ok) throw new Error(\"HTTP \" + r.status);\n        return await r.json();\n      } catch (e) { errors[key] = e.message || String(e); return null; }\n    };\n\n    const nws = { headers: { Accept: \"application/geo+json\" } };\n    const [alertsD, alertsM, moAlerts, points, obs, gauges, gaugeMain, air, quakes, news] = await Promise.all([\n      j(\"alertsD\", \"https://api.weather.gov/alerts/active?point=\" + DANFORTH.lat + \",\" + DANFORTH.lon, nws),\n      j(\"alertsM\", \"https://api.weather.gov/alerts/active?point=\" + MEDICAL.lat + \",\" + MEDICAL.lon, nws),\n      j(\"moAlerts\", \"https://api.weather.gov/alerts/active?area=MO\", nws),\n      j(\"points\", \"https://api.weather.gov/points/\" + DANFORTH.lat + \",\" + DANFORTH.lon, nws),\n      j(\"obs\", \"https://api.weather.gov/stations/KSTL/observations/latest\", nws),\n      j(\"gauges\", \"https://waterservices.usgs.gov/nwis/iv/?format=json&countyCd=29189,29510&parameterCd=00065&siteStatus=active\"),\n      j(\"gaugeMain\", \"https://waterservices.usgs.gov/nwis/iv/?format=json&sites=07010000&parameterCd=00065,00060&siteStatus=active\"),\n      j(\"air\", \"https://air-quality-api.open-meteo.com/v1/air-quality?latitude=\" + DANFORTH.lat + \"&longitude=\" + DANFORTH.lon + \"&current=us_aqi,pm2_5,pm10,ozone&timezone=America%2FChicago\"),\n      j(\"quakes\", \"https://earthquake.usgs.gov/fdsnws/event/1/query?format=geojson&starttime=\" + new Date(Date.now() - 30 * 864e5).toISOString().slice(0, 10) + \"&minmagnitude=2.5&minlatitude=34.5&maxlatitude=39.5&minlongitude=-92&maxlongitude=-87.5&orderby=time\"),\n      j(\"news\", \"https://api.gdeltproject.org/api/v2/doc/doc?query=%28%22St.%20Louis%22%20OR%20%22Saint%20Louis%22%29%20sourcecountry:US&mode=artlist&maxrecords=8&format=json&sort=datedesc\")\n    ]);\n\n    let hourly = [];\n    if (points && points.properties && points.properties.forecastHourly) {\n      const h = await j(\"hourly\", points.properties.forecastHourly, nws);\n      if (h && h.properties) hourly = h.properties.periods.slice(0, 24);\n    }\n\n    this.setState({ loading: false, retrieved: new Date(), alertsD: (alertsD && alertsD.features) || [], alertsM: (alertsM && alertsM.features) || [], moAlerts: (moAlerts && moAlerts.features) || [], obs: obs && obs.properties, hourly, gauges, gaugeMain, air: air && air.current, quakes: quakes && quakes.features, news: news && news.articles, errors });\n  }\n\n  campusAlerts() {\n    const map = new Map();\n    this.state.alertsD.forEach(f => map.set(f.id, { f, campuses: [\"Danforth\"] }));\n    this.state.alertsM.forEach(f => {\n      const e = map.get(f.id);\n      if (e) e.campuses.push(\"Medical\");\n      else map.set(f.id, { f, campuses: [\"Medical\"] });\n    });\n    return [...map.values()];\n  }\n\n  renderVals() {\n    const s = this.state;\n    const err = s.errors;\n    const ca = this.campusAlerts();\n    const hasAlerts = ca.length > 0;\n    const retrieved = s.retrieved ? fmtTime(s.retrieved.toISOString()) + \" CT\" : \"loading…\";\n\n    const alerts = ca.map(({ f, campuses }) => {\n      const p = f.properties;\n      return {\n        event: p.event,\n        headline: p.headline || p.parameters && p.parameters.NWSheadline && p.parameters.NWSheadline[0] || \"\",\n        area: p.areaDesc,\n        severity: p.severity || \"—\",\n        urgency: p.urgency || \"—\",\n        sender: p.senderName || \"NWS\",\n        onset: fmtTime(p.onset || p.effective),\n        expires: fmtTime(p.ends || p.expires),\n        campus: campuses.join(\" + \") + \" in polygon\"\n      };\n    });\n\n    const alertHeadCount = s.loading ? \"Loading NWS CAP\" : hasAlerts ? alerts.length + (alerts.length === 1 ? \" Active Alert\" : \" Active Alerts\") : \"No Active Alerts\";\n    const alertHeadLine = s.loading ? \"Querying api.weather.gov for both campus coordinates…\"\n      : err.alertsD || err.alertsM ? \"NWS alerts endpoint unreachable (\" + (err.alertsD || err.alertsM) + \") — treat as unknown, not as all-clear.\"\n      : hasAlerts ? \"NWS CAP polygons currently cover a Washington University campus.\" : \"No NWS CAP product currently covers either campus coordinate. \" + s.moAlerts.length + \" alert(s) active statewide in Missouri.\";\n\n    const bandRed = hasAlerts || !!(err.alertsD || err.alertsM);\n\n    const o = s.obs || {};\n    const t = c2f(o.temperature && o.temperature.value);\n    const hi = c2f(o.heatIndex && o.heatIndex.value);\n    const dew = c2f(o.dewpoint && o.dewpoint.value);\n    const wind = kmh2mph(o.windSpeed && o.windSpeed.value);\n    const gust = kmh2mph(o.windGust && o.windGust.value);\n    const vis = o.visibility && o.visibility.value !== null ? Math.round(o.visibility.value / 1609.34 * 10) / 10 + \" mi\" : \"—\";\n    const observation = err.obs ? [{ name: \"Station unreachable\", value: \"—\", tone: \"#ae1800\" }] : [\n      { name: \"Conditions\", value: o.textDescription || \"—\", tone: \"#201e1d\" },\n      { name: \"Temperature\", value: t === null ? \"—\" : t + \"°F\", tone: t !== null && t >= 90 ? \"#ae1800\" : \"#201e1d\" },\n      { name: \"Heat index\", value: hi === null ? \"n/a\" : hi + \"°F\", tone: hi !== null && hi >= 100 ? \"#ae1800\" : \"#201e1d\" },\n      { name: \"Dewpoint\", value: dew === null ? \"—\" : dew + \"°F\", tone: \"#201e1d\" },\n      { name: \"Wind\", value: wind === null ? \"—\" : wind + \" mph\" + (gust ? \" g\" + gust : \"\"), tone: gust && gust >= 35 ? \"#ae1800\" : \"#201e1d\" },\n      { name: \"Visibility\", value: vis, tone: \"#201e1d\" },\n      { name: \"Relative humidity\", value: o.relativeHumidity && o.relativeHumidity.value !== null ? Math.round(o.relativeHumidity.value) + \"%\" : \"—\", tone: \"#201e1d\" }\n    ];\n\n    // Distance from a site to the nearer campus, so the county sweep is ranked by\n    // relevance to WashU rather than by USGS site number.\n    const milesToCampus = (lat, lon) => {\n      if (typeof lat !== \"number\" || typeof lon !== \"number\") return 9999;\n      return Math.min(...[DANFORTH, MEDICAL].map(c => {\n        const dy = (lat - c.lat) * 69, dx = (lon - c.lon) * 69 * Math.cos(c.lat * Math.PI / 180);\n        return Math.sqrt(dx * dx + dy * dy);\n      }));\n    };\n    const readSeries = (payload, tag) => {\n      const out = [];\n      const seen = new Set();\n      const series = payload && payload.value && payload.value.timeSeries || [];\n      series.forEach(ts => {\n        if (ts.variable.variableCode[0].value !== \"00065\") return;\n        const site = ts.sourceInfo.siteCode[0].value;\n        if (seen.has(site)) return;\n        const v = ts.values[0] && ts.values[0].value[0];\n        if (!v || v.value === \"-999999\") return;\n        seen.add(site);\n        const g = ts.sourceInfo.geoLocation && ts.sourceInfo.geoLocation.geogLocation || {};\n        const miles = milesToCampus(g.latitude, g.longitude);\n        out.push({\n          key: site,\n          name: ts.sourceInfo.siteName.replace(/,\\s*MO$/i, \"\"),\n          site: \"USGS \" + site + (tag ? \" · \" + tag : miles < 900 ? \" · \" + miles.toFixed(1) + \" mi from campus\" : \"\"),\n          time: fmtTime(v.dateTime),\n          value: parseFloat(v.value).toFixed(2) + \" ft\",\n          miles\n        });\n      });\n      return out;\n    };\n\n    const mainGauge = readSeries(s.gaugeMain, \"Mississippi mainstem\")[0];\n    const nearby = readSeries(s.gauges).sort((a, b) => a.miles - b.miles).filter(g => !mainGauge || g.key !== mainGauge.key).slice(0, 5);\n    let gauges = (mainGauge ? [mainGauge] : []).concat(nearby);\n    if (!gauges.length) gauges = [{ name: err.gauges && err.gaugeMain ? \"USGS NWIS unreachable\" : \"No active gage-height sites returned\", site: \"sites=07010000 · countyCd 29189, 29510\", time: \"—\", value: \"—\" }];\n\n    const a = s.air || {};\n    const aqi = a.us_aqi;\n    const air = err.air ? [{ name: \"Air-quality service unreachable\", value: \"—\", tone: \"#ae1800\" }] : [\n      { name: \"US AQI\", value: aqi === undefined ? \"—\" : String(Math.round(aqi)), tone: aqi >= 101 ? \"#ae1800\" : \"#201e1d\" },\n      { name: \"PM2.5\", value: a.pm2_5 === undefined ? \"—\" : Math.round(a.pm2_5) + \" µg/m³\", tone: \"#201e1d\" },\n      { name: \"PM10\", value: a.pm10 === undefined ? \"—\" : Math.round(a.pm10) + \" µg/m³\", tone: \"#201e1d\" },\n      { name: \"Ozone\", value: a.ozone === undefined ? \"—\" : Math.round(a.ozone) + \" µg/m³\", tone: \"#201e1d\" }\n    ];\n\n    const quakes = (s.quakes || []).slice(0, 4).map(q => ({ mag: \"M\" + q.properties.mag.toFixed(1), place: q.properties.place, time: fmtDay(new Date(q.properties.time).toISOString()) }));\n    if (!quakes.length) quakes.push({ mag: \"—\", place: err.quakes ? \"USGS event service unreachable\" : \"No M2.5+ events in the box in 30 days\", time: \"\" });\n\n    const temps = s.hourly.map(h => h.temperature).filter(v => typeof v === \"number\");\n    const tmin = temps.length ? Math.min(...temps) : 0;\n    const tmax = temps.length ? Math.max(...temps) : 1;\n    const hourly = s.hourly.map(h => {\n      const pop = h.probabilityOfPrecipitation && h.probabilityOfPrecipitation.value || 0;\n      const frac = tmax === tmin ? 0.5 : (h.temperature - tmin) / (tmax - tmin);\n      return { pop: Math.max(1, pop) + \"%\", tempPos: Math.round(8 + frac * 84) + \"%\" };\n    });\n    const hourlyTicks = s.hourly.length ? [0, 6, 12, 18, s.hourly.length - 1].map(i => ({ label: s.hourly[i] ? fmtTime(s.hourly[i].startTime) : \"\" })) : [];\n\n    const events = {};\n    s.moAlerts.forEach(f => {\n      const p = f.properties;\n      const k = p.event;\n      events[k] = events[k] || { count: 0, sev: [], campus: false };\n      events[k].count++;\n      events[k].sev.push(p.severity);\n      if (ca.some(x => x.f.properties.event === k)) events[k].campus = true;\n    });\n    const sevRank = [\"Extreme\", \"Severe\", \"Moderate\", \"Minor\", \"Unknown\"];\n    const inventory = Object.entries(events).sort((x, y) => y[1].count - x[1].count).slice(0, 8).map(([event, v]) => ({\n      event, count: String(v.count),\n      severity: sevRank.find(r => v.sev.includes(r)) || \"Unknown\",\n      campus: v.campus ? \"Yes — campus in polygon\" : \"No\",\n      tone: v.campus ? \"#ae1800\" : \"#605d5d\"\n    }));\n    if (!inventory.length) inventory.push({ event: s.loading ? \"Querying api.weather.gov…\" : err.moAlerts ? \"NWS alerts endpoint unreachable\" : \"No active alerts in Missouri\", count: s.loading ? \"—\" : \"0\", severity: \"—\", campus: s.loading ? \"—\" : \"No\", tone: \"#605d5d\" });\n\n    const news = (s.news || []).slice(0, 8).map(n => ({\n      title: n.title, url: n.url, domain: n.domain,\n      time: n.seendate ? n.seendate.slice(4, 6) + \"/\" + n.seendate.slice(6, 8) + \" \" + n.seendate.slice(9, 11) + \":\" + n.seendate.slice(11, 13) + \"Z\" : \"\"\n    }));\n    const newsConnected = news.length > 0;\n    if (!newsConnected) news.push({ title: err.news ? \"GDELT DOC API request failed (\" + err.news + \") — needs a server-side collector to proxy the query.\" : \"No articles returned for the current query.\", url: \"https://api.gdeltproject.org/api/v2/doc/doc\", domain: \"gdeltproject.org\", time: \"\" });\n\n    const st = (ok, okLabel) => ok\n      ? { status: okLabel || \"Live\", dot: \"#201e1d\", chipBg: \"#201e1d\", chipFg: \"#f3f2f2\", tone: \"#605d5d\" }\n      : { status: \"Not connected\", dot: \"#ec3013\", chipBg: \"#ffe0d9\", chipFg: \"#7c1405\", tone: \"#ae1800\" };\n\n    const registry = [\n      { name: \"NWS active alerts (CAP)\", endpoint: \"api.weather.gov/alerts/active?point=…\", detail: err.alertsD ? err.alertsD : ca.length + \" covering campus · \" + s.moAlerts.length + \" statewide\", ...st(!err.alertsD) },\n      { name: \"NWS hourly forecast\", endpoint: \"api.weather.gov/gridpoints/LSX/…\", detail: err.hourly || err.points ? (err.hourly || err.points) : s.hourly.length + \" hourly periods\", ...st(s.hourly.length > 0) },\n      { name: \"ASOS observations · KSTL\", endpoint: \"api.weather.gov/stations/KSTL/observations/latest\", detail: err.obs ? err.obs : \"Observed \" + fmtTime(o.timestamp), ...st(!err.obs) },\n      { name: \"USGS NWIS river gauges\", endpoint: \"waterservices.usgs.gov/nwis/iv/ · sites=07010000 + countyCd=29189,29510\", detail: err.gauges || err.gaugeMain ? (err.gaugeMain || err.gauges) : \"Mississippi mainstem + \" + Math.max(0, gauges.length - 1) + \" nearest county sites\", ...st(!err.gauges || !err.gaugeMain) },\n      { name: \"NWS AHPS flood stages\", endpoint: \"water.weather.gov\", detail: \"No CORS-open JSON — needs proxy for action/flood thresholds\", ...st(false) },\n      { name: \"Air quality (CAMS via Open-Meteo)\", endpoint: \"air-quality-api.open-meteo.com/v1/air-quality\", detail: err.air ? err.air : \"AQI \" + (aqi === undefined ? \"—\" : Math.round(aqi)), ...st(!err.air) },\n      { name: \"USGS seismic events\", endpoint: \"earthquake.usgs.gov/fdsnws/event/1/query\", detail: err.quakes ? err.quakes : (s.quakes || []).length + \" events, 30 days, M2.5+\", ...st(!err.quakes) },\n      { name: \"GDELT news monitor\", endpoint: \"api.gdeltproject.org/api/v2/doc/doc\", detail: newsConnected ? news.length + \" articles, sorted newest\" : \"Blocked from the browser — needs proxy\", ...st(newsConnected) },\n      { name: \"EPA AirNow (official AQI)\", endpoint: \"airnowapi.org/aq/observation\", detail: \"Requires free API key\", ...st(false) },\n      { name: \"X / Bluesky / Reddit listening\", endpoint: \"platform APIs\", detail: \"Requires authenticated app credentials\", ...st(false) },\n      { name: \"Ameren Missouri outages\", endpoint: \"no public API\", detail: \"Outage map is not machine-readable; needs scraper or utility agreement\", ...st(false) },\n      { name: \"Metro Transit GTFS-RT\", endpoint: \"metrostlouis.org developer feed\", detail: \"Requires registration; protobuf needs server-side decode\", ...st(false) },\n      { name: \"MoDOT traveler information\", endpoint: \"traveler.modot.org API\", detail: \"Requires API key\", ...st(false) },\n      { name: \"WUPD CAD / WashU Alert\", endpoint: \"internal systems\", detail: \"Internal integration — not open-source data\", ...st(false) },\n      { name: \"Scanner / PulsePoint\", endpoint: \"third-party\", detail: \"Terms of use and audio transcription pipeline required\", ...st(false) }\n    ];\n\n    const connected = registry.filter(r => r.status === \"Live\").length;\n\n    const kpis = [\n      { label: \"Alerts covering campus\", value: s.loading ? \"…\" : String(ca.length), note: ca.length ? alerts.map(x => x.event).join(\", \") : \"None at retrieval time\", tone: ca.length ? \"#ae1800\" : \"#201e1d\" },\n      { label: \"Missouri alerts active\", value: s.loading ? \"…\" : String(s.moAlerts.length), note: \"All NWS CAP products, statewide\", tone: \"#201e1d\" },\n      { label: \"Temperature · KSTL\", value: t === null ? \"—\" : t + \"°F\", note: hi === null ? (o.textDescription || \"—\") : \"Heat index \" + hi + \"°F\", tone: t !== null && t >= 90 ? \"#ae1800\" : \"#201e1d\" },\n      { label: \"US AQI\", value: aqi === undefined ? \"—\" : String(Math.round(aqi)), note: aqi === undefined ? \"—\" : aqi <= 50 ? \"Good\" : aqi <= 100 ? \"Moderate\" : \"Unhealthy for sensitive groups\", tone: aqi >= 101 ? \"#ae1800\" : \"#201e1d\" },\n      { label: \"Peak PoP next 24h\", value: s.hourly.length ? Math.max(...s.hourly.map(h => (h.probabilityOfPrecipitation && h.probabilityOfPrecipitation.value) || 0)) + \"%\" : \"—\", note: \"NWS hourly forecast\", tone: \"#201e1d\" },\n      { label: \"Feeds connected\", value: connected + \" / \" + registry.length, note: (registry.length - connected) + \" need a key or proxy\", tone: \"#201e1d\" }\n    ];\n\n    const envBits = [];\n    if (t !== null) envBits.push(\"KSTL reports \" + t + \"°F\" + (o.textDescription ? \", \" + o.textDescription.toLowerCase() : \"\") + (wind ? \", wind \" + wind + \" mph\" + (gust ? \" gusting \" + gust : \"\") : \"\") + \".\");\n    if (aqi !== undefined) envBits.push(\"US AQI \" + Math.round(aqi) + \".\");\n    if (mainGauge) envBits.push(\"Mississippi River at St. Louis gage height \" + mainGauge.value + \" (stage only — flood-stage context requires the NWS AHPS feed, which is not connected).\");\n    else if (gauges[0] && gauges[0].value !== \"—\") envBits.push(\"Nearest reporting gauge: \" + gauges[0].name + \" at \" + gauges[0].value + \".\");\n\n    const summary = s.loading ? \"Querying connected feeds…\"\n      : hasAlerts\n        ? alerts.length + \" active NWS product\" + (alerts.length === 1 ? \"\" : \"s\") + \" cover\" + (alerts.length === 1 ? \"s\" : \"\") + \" a Washington University campus: \" + alerts.map(x => x.event + \" (\" + x.campus.replace(\" in polygon\", \"\") + \", to \" + x.expires + \")\").join(\"; \") + \".\"\n        : \"No NWS alert polygon currently covers the Danforth or Medical campus coordinate. \" + s.moAlerts.length + \" alert\" + (s.moAlerts.length === 1 ? \"\" : \"s\") + \" active elsewhere in Missouri; \" + (temps.length ? \"forecast high of \" + tmax + \"°F and peak precipitation probability of \" + Math.max(...s.hourly.map(h => (h.probabilityOfPrecipitation && h.probabilityOfPrecipitation.value) || 0)) + \"% in the next 24 hours.\" : \"hourly forecast unavailable.\");\n\n    const views = [[\"hazards\", \"All-Hazards Picture\"], [\"weather\", \"Weather Monitoring\"]].map(([k, label]) => ({\n      label,\n      bg: (s.view || \"hazards\") === k ? \"#201e1d\" : \"transparent\",\n      fg: (s.view || \"hazards\") === k ? \"#f3f2f2\" : \"#201e1d\",\n      pick: () => this.setState({ view: k })\n    }));\n\n    return {\n      views,\n      isHazards: (s.view || \"hazards\") === \"hazards\",\n      isWeather: s.view === \"weather\",\n      pageTitle: s.view === \"weather\" ? \"Weather Monitoring\" : \"All-Hazards Common Operating Picture\",\n      retrieved,\n      retrievedFull: s.retrieved ? \"Retrieved \" + s.retrieved.toLocaleString(\"en-US\", { timeZone: TZ }) + \" CT\" : \"\",\n      liveDot: s.loading ? \"#9b9797\" : \"#ec3013\",\n      liveLabel: s.loading ? \"Fetching\" : \"Snapshot at \" + retrieved,\n      refresh: () => this.load(),\n      alertBandBg: bandRed ? \"#ec3013\" : \"#eae9e9\",\n      alertBandFg: bandRed ? \"#f3f2f2\" : \"#201e1d\",\n      alertBandRule: bandRed ? \"rgba(243,242,242,0.5)\" : \"rgba(32,30,29,0.4)\",\n      alertHeadCount, alertHeadLine, hasAlerts, alerts, kpis,\n      obsStation: err.obs ? \"KSTL — unreachable\" : \"KSTL Lambert Field ASOS · observed \" + fmtTime(o.timestamp) + \" CT\",\n      observation, gauges, air, quakes,\n      summary,\n      summaryBasis: connected + \" of \" + registry.length + \" feeds connected\",\n      summaryAlerts: hasAlerts ? alerts.map(x => x.event + \" — \" + (x.headline || x.area)).join(\" · \") : \"No campus-covering NWS product at retrieval time. Statewide count: \" + s.moAlerts.length + \".\",\n      summaryEnv: envBits.length ? envBits.join(\" \") : \"Environmental feeds returned no values.\",\n      summaryGaps: \"No social, utility-outage, transit, roadway or campus-CAD data is present in this snapshot — those feeds are not connected, so this picture is weather, water, air, seismic and news only.\",\n      hourlySource: err.hourly || err.points ? \"Unavailable\" : \"api.weather.gov\",\n      hourlyRange: s.hourly.length ? \"Periods \" + fmtTime(s.hourly[0].startTime) + \" to \" + fmtTime(s.hourly[s.hourly.length - 1].startTime) + \" CT · \" + s.hourly.length + \" hours\" : \"No hourly periods returned\",\n      hourlyCols: String(Math.max(1, s.hourly.length)),\n      hourly, hourlyTicks,\n      tempRange: temps.length ? tmin + \"–\" + tmax + \"°F\" : \"—\",\n      inventory,\n      inventoryNote: err.moAlerts ? \"Statewide query failed: \" + err.moAlerts : \"Grouped from \" + s.moAlerts.length + \" active CAP products for area=MO. Campus column tests the same alert IDs against both campus point queries.\",\n      newsSource: newsConnected ? \"GDELT DOC API · query: (\\\"St. Louis\\\" OR \\\"Saint Louis\\\"), US sources, newest first\" : \"GDELT DOC API · not connected from the browser\",\n      news, registry,\n      registryNote: connected + \" live · \" + (registry.length - connected) + \" require credentials or a proxy\"\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
